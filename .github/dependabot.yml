# Dependency updates (A-02 #4). Weekly, one grouped PR per ecosystem so a solo maintainer
# isn't flooded; security updates still open on their own as soon as an advisory lands.
# Patch/minor PRs merge themselves once every check is green; majors get the `dependabot-major`
# label for the coordinator chat (Decision 039, .github/workflows/dependabot-automerge.yml).
# Mondays 09:00 Paris, so merges land in the daytime.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    groups:
      actions:
        patterns: ["*"]

  # pnpm workspace: one lockfile at the root covers apps/web and packages/schema.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    # Keep equal to minimumReleaseAge in pnpm-workspace.yaml (3 days), or update jobs fail (Decision 052).
    cooldown:
      default-days: 3
    # @types/node follows the Node runtime in .nvmrc and the Dockerfile (22), not the newest Node.
    # Bump it by hand together with the runtime (Decision 053).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
      npm-prod:
        dependency-type: production
        update-types: [minor, patch]

  # Python pipeline (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images (node:*-slim, busybox, python) in the two Dockerfiles.
  - package-ecosystem: docker
    directories: [/apps/web, /pipeline]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    groups:
      docker:
        patterns: ["*"]
