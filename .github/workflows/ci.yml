name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege (A-02): read-only token by default, and every job states its own permissions.
# Triggers are `pull_request` (never `pull_request_target`), so PRs from forks get a read-only
# token and no secrets. Third-party actions are pinned to commit SHAs (tag in the comment);
# Dependabot (github-actions ecosystem) bumps the SHA and the comment together.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which parts of the monorepo exist yet, so jobs switch on
  # automatically once apps/web or pipeline are added.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.check.outputs.web }}
      schema: ${{ steps.check.outputs.schema }}
      pipeline: ${{ steps.check.outputs.pipeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          [ -f apps/web/package.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
          [ -f packages/schema/package.json ] && echo "schema=true" >> "$GITHUB_OUTPUT" || echo "schema=false" >> "$GITHUB_OUTPUT"
          [ -f pipeline/pyproject.toml ] && echo "pipeline=true" >> "$GITHUB_OUTPUT" || echo "pipeline=false" >> "$GITHUB_OUTPUT"

  repo-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required files exist
        run: |
          for f in AGENTS.md CLAUDE.md README.md LICENSE DATA_LICENSE.md DECISIONS.md ROADMAP.md BOARD.md QUESTIONS.md CHANGELOG.md .env.example; do
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          done
      - name: No env files or large files committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          [ -z "$bad" ] || { echo "::error::Env files must not be committed: $bad"; exit 1; }
          big=$(git ls-files -z | xargs -0 -I{} sh -c '[ -f "{}" ] && [ $(wc -c < "{}") -gt 5242880 ] && echo "{}"' || true)
          [ -z "$big" ] || { echo "::error::Files over 5 MB (raw data goes to object storage): $big"; exit 1; }

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # pnpm version comes from "packageManager" in the root package.json.
      - run: corepack enable
      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/web run --if-present lint
      - run: pnpm --filter ./apps/web run --if-present typecheck
      - run: pnpm --filter ./apps/web run --if-present test
      - run: pnpm --filter ./apps/web run --if-present build
      # Perf budget (A-01): Explore first-load JS < 200 KB gzip, client catalogue < 300 KB gzip.
      - name: Perf budget
        run: node apps/web/scripts/budget.mjs

  # Playwright smoke + review tests on a production build (A-02 #1: the "no foreign request"
  # guarantee must run in CI). Uses the dev fixture, like local `pnpm e2e`.
  e2e:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium (with system deps)
        run: pnpm --filter @ev/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ev/web build
      - run: pnpm --filter @ev/web e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  schema:
    needs: detect
    if: needs.detect.outputs.schema == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/schema test

  pipeline:
    needs: detect
    if: needs.detect.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: pipeline
      # --locked: fail if uv.lock is out of step with pyproject.toml (lockfile is the truth).
      # Fallback if uv is unavailable: pip install -e ".[dev]" (dev extras mirror the uv dev group).
      # --locked: fail if uv.lock is out of step with pyproject.toml (A-02: lockfile is the truth).
      - name: Install
        run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # Dependency audit (A-02): warns, never fails the build (continue-on-error), so a new
  # advisory shows up as a yellow job without blocking merges. Not part of ci-ok.
  audit:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.detect.outputs.web == 'true' || needs.detect.outputs.schema == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (production dependencies)
        if: needs.detect.outputs.web == 'true' || needs.detect.outputs.schema == 'true'
        run: |
          corepack enable
          pnpm audit --prod
      - if: needs.detect.outputs.pipeline == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: pipeline
      # Audits the locked runtime set (hashes from uv.lock), without installing anything.
      - name: pip-audit (pipeline runtime dependencies)
        if: needs.detect.outputs.pipeline == 'true'
        working-directory: pipeline
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  # One stable check name to require on main, whatever jobs ran.
  ci-ok:
    if: always()
    needs: [repo-checks, web, e2e, schema, pipeline]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | grep -E '"result": "(failure|cancelled)"' && exit 1 || exit 0
