name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repo unless they ask for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which parts of the monorepo exist yet, so jobs switch on
  # automatically once apps/web or pipeline are added.
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
      pipeline: ${{ steps.check.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          [ -f apps/web/package.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
          [ -f pipeline/pyproject.toml ] && echo "pipeline=true" >> "$GITHUB_OUTPUT" || echo "pipeline=false" >> "$GITHUB_OUTPUT"

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required files exist
        run: |
          for f in AGENTS.md CLAUDE.md README.md LICENSE DATA_LICENSE.md DECISIONS.md ROADMAP.md BOARD.md QUESTIONS.md CHANGELOG.md .env.example; do
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          done
      - name: No env files or large files committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          [ -z "$bad" ] || { echo "::error::Env files must not be committed: $bad"; exit 1; }
          big=$(git ls-files -z | xargs -0 -I{} sh -c '[ -f "{}" ] && [ $(wc -c < "{}") -gt 5242880 ] && echo "{}"' || true)
          [ -z "$big" ] || { echo "::error::Files over 5 MB (raw data goes to object storage): $big"; exit 1; }

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/package.json
      - run: corepack enable
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ] || [ -f ../../pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          else npm ci; fi
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  pipeline:
    needs: detect
    if: needs.detect.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: pipeline/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install ruff pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # One stable check name to require on main, whatever jobs ran.
  ci-ok:
    if: always()
    needs: [repo-checks, web, pipeline]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | grep -E '"result": "(failure|cancelled)"' && exit 1 || exit 0
