name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege (A-02): read-only token by default, and every job states its own permissions.
# Triggers are `pull_request` (never `pull_request_target`), so PRs from forks get a read-only
# token and no secrets. Third-party actions are pinned to commit SHAs (tag in the comment);
# Dependabot (github-actions ecosystem) bumps the SHA and the comment together.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which parts of the monorepo exist yet, so jobs switch on
  # automatically once apps/web or pipeline are added.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.check.outputs.web }}
      schema: ${{ steps.check.outputs.schema }}
      pipeline: ${{ steps.check.outputs.pipeline }}
      data: ${{ steps.data.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so the data step can diff against the base commit
      - id: check
        run: |
          [ -f apps/web/package.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
          [ -f packages/schema/package.json ] && echo "schema=true" >> "$GITHUB_OUTPUT" || echo "schema=false" >> "$GITHUB_OUTPUT"
          [ -f pipeline/pyproject.toml ] && echo "pipeline=true" >> "$GITHUB_OUTPUT" || echo "pipeline=false" >> "$GITHUB_OUTPUT"
      # T-057: data-qa runs when data/, pipeline/ or config/ changed (PR: vs the base commit;
      # push: vs the previous head). Manual runs, new branches and unknown bases always run it.
      # Event values come in through env, never pasted into the script (injection-safe).
      - id: data
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ ! -f pipeline/pyproject.toml ]; then echo "data=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          base=""
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "data=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD -- data config pipeline | grep -q .; then
            echo "data=true" >> "$GITHUB_OUTPUT"
          else
            echo "data=false" >> "$GITHUB_OUTPUT"
          fi

  repo-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required files exist
        run: |
          for f in AGENTS.md CLAUDE.md README.md LICENSE DATA_LICENSE.md DECISIONS.md ROADMAP.md BOARD.md QUESTIONS.md CHANGELOG.md .env.example; do
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          done
      - name: No env files or large files committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          [ -z "$bad" ] || { echo "::error::Env files must not be committed: $bad"; exit 1; }
          # Raw data never goes in git (5 MB cap). Published releases under data/releases/ get a
          # temporary 25 MB cap with a warning until they move out of git (Decision 035, T-064).
          big=$(git ls-files -z | grep -zv '^data/releases/' | xargs -0 -I{} sh -c '[ -f "{}" ] && [ $(wc -c < "{}") -gt 5242880 ] && echo "{}"' || true)
          [ -z "$big" ] || { echo "::error::Files over 5 MB (raw data goes to object storage): $big"; exit 1; }
          rel=$(git ls-files -z -- data/releases | xargs -0 -I{} sh -c '[ -f "{}" ] && [ $(wc -c < "{}") -gt 5242880 ] && echo "{}"' || true)
          [ -z "$rel" ] || echo "::warning::Release files over 5 MB (move releases out of git, T-064): $rel"
          huge=$(git ls-files -z -- data/releases | xargs -0 -I{} sh -c '[ -f "{}" ] && [ $(wc -c < "{}") -gt 26214400 ] && echo "{}"' || true)
          [ -z "$huge" ] || { echo "::error::Release files over 25 MB: $huge"; exit 1; }
      - name: No merge-conflict markers (rule G-03)
        run: |
          m=$(git grep -nE '^(<{7}|={7}|>{7})( |$)' -- . ':!*.png' ':!*.jpg' || true)
          [ -z "$m" ] || { echo "::error::Merge-conflict markers found:"; echo "$m" | head -30; exit 1; }
      - name: Gate-guard unit tests (T-121)
        run: python3 -m unittest discover -s scripts/tests
      - name: Decision numbers are unique (rule G-04)
        run: |
          d=$(grep -oE '^## Decision [0-9]+' DECISIONS.md | sort | uniq -d)
          [ -z "$d" ] || { echo "::error::Duplicate decision numbers in DECISIONS.md: $d"; exit 1; }

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # pnpm version comes from "packageManager" in the root package.json.
      - run: corepack enable
      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile
      # Release files live only on the GitHub Release (Decision 035, T-064): fetch `latest` by
      # manifest (size + sha256) before the unit tests, like data-qa, so tests see the real
      # release instead of the dev fixture. Public download; no token needed.
      - name: Fetch the latest release
        run: pnpm --filter ./apps/web run fetch-release
      - run: pnpm --filter ./apps/web run --if-present lint
      - run: pnpm --filter ./apps/web run --if-present typecheck
      - run: pnpm --filter ./apps/web run --if-present test
      - run: pnpm --filter ./apps/web run --if-present build
        env:
          APP_URL: https://ev.example.com # Q-090: check production canonicals in CI
      # Perf budget (A-01): Explore first-load JS < 200 KB gzip, client catalogue < 300 KB gzip.
      - name: Perf budget
        run: node apps/web/scripts/budget.mjs

  # Playwright smoke + review tests on a production build (A-02 #1: the "no foreign request"
  # guarantee must run in CI). Uses the dev fixture, like local `pnpm e2e`.
  e2e:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium (with system deps)
        run: pnpm --filter @ev/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ev/web build
        env:
          APP_URL: https://ev.example.com # Q-090
      - run: pnpm --filter @ev/web e2e
        env:
          APP_URL: https://ev.example.com
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  schema:
    needs: detect
    if: needs.detect.outputs.schema == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/schema test

  pipeline:
    needs: detect
    if: needs.detect.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: pipeline
      # --locked: fail if uv.lock is out of step with pyproject.toml (lockfile is the truth).
      # Fallback if uv is unavailable: pip install -e ".[dev]" (dev extras mirror the uv dev group).
      # --locked: fail if uv.lock is out of step with pyproject.toml (A-02: lockfile is the truth).
      - name: Install
        run: uv sync --locked --all-extras --dev
      # Release files live only on the GitHub Release (Decision 035, T-064): tests that read
      # data/releases/latest need them. Downloaded and sha256-checked by manifest, like data-qa.
      - name: Fetch the latest release
        run: uv run ev release fetch latest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # Data QA (T-057): seed / variant / taxonomy validators, then the blocking release QA
  # (provenance completeness, licence gate) re-run on the COMMITTED release. Staging is
  # git-ignored, so CI checks what is published rather than rebuilding it.
  data-qa:
    needs: detect
    if: needs.detect.outputs.data == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: pipeline
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Validate seed models
        run: uv run python -I ../data/seed/validate_seed.py ../data/seed/models.yaml
      - name: Validate seed variants
        run: uv run python -I ../data/seed/validate_variants.py
      - name: Validate taxonomy, platforms, packs and variant links
        run: uv run python -I ../data/taxonomy/validate_taxonomy.py
      - name: Back-test shortlist rules against Menno's picks (Decision 038)
        run: uv run python -I ../data/editorial/backtest_rules.py
      - name: Blocking QA on the committed release
        run: |
          if [ ! -e ../data/releases/latest ]; then echo "No committed release yet; skipped."; exit 0; fi
          # T-064: release files outside git are downloaded and sha256-checked by manifest.
          uv run ev release fetch latest --only catalogue.json,facts.parquet,charging_stats.json
          uv run python -m ev_pipeline.qa check-release ../data/releases/latest

  # Dependency audit (A-02): warns, never fails the build (continue-on-error), so a new
  # advisory shows up as a yellow job without blocking merges. Not part of ci-ok.
  audit:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.detect.outputs.web == 'true' || needs.detect.outputs.schema == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (production dependencies)
        if: needs.detect.outputs.web == 'true' || needs.detect.outputs.schema == 'true'
        run: |
          corepack enable
          pnpm audit --prod
      - if: needs.detect.outputs.pipeline == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: pipeline
      # Audits the locked runtime set (hashes from uv.lock), without installing anything.
      - name: pip-audit (pipeline runtime dependencies)
        if: needs.detect.outputs.pipeline == 'true'
        working-directory: pipeline
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  gate-guard:
    # T-121, rule G-06: a PR can't change the checks that judge it. Mode lives in config/gate-files.yaml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check gate files and test weakening
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/gate_guard.py "$BASE_SHA" "$HEAD_SHA"

  # One stable check name to require on main, whatever jobs ran.
  ci-ok:
    if: always()
    needs: [repo-checks, gate-guard, web, e2e, schema, pipeline, data-qa]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | grep -E '"result": "(failure|cancelled)"' && exit 1 || exit 0
