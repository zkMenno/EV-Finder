name: Images

# Builds linux/arm64 images for the AppInfra server (Hetzner CAX31, Arm) and pushes them to GHCR
# (Decisions 005, 006). No deploy step: deploy is a manual SSH step for now (infra/README.md).
# Pull requests that touch an image's inputs build both images too, but never push (T-013 review),
# so a broken Dockerfile shows up before it reaches main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/web/**
      - pipeline/**
      - packages/**
      - "**/Dockerfile"
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/images.yml
  workflow_dispatch:

# Least privilege by default; the build job asks for packages:write only.
permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }} (linux/arm64)
    # Native Arm runner (free for public repos): no QEMU, real arm64 Next/SWC and wheel builds.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: jobs
            dockerfile: pipeline/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Pull requests build only: no registry login, no push.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<short> (what the server should pin), plus `main` for the newest main build.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR names must be lowercase, so the owner is spelled out rather than taken from github.repository_owner.
          images: ghcr.io/zkmenno/ev-finder-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          # PR builds read the cache but never write it (keeps main's cache clean).
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}
