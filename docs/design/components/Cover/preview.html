<!-- @dsCard height=288 -->
<style>
html,body{margin:0;background:var(--paper)}
.cv{position:relative;width:960px;height:288px;background:var(--paper);overflow:hidden}
.cv svg{position:absolute;left:0;top:0}
.sea{fill:var(--sea)}.paper{fill:var(--paper);stroke:var(--ink);stroke-width:2}.tom{fill:var(--tomato)}.sun{fill:var(--sunflower)}
.slot{fill:none;stroke:var(--ink);stroke-width:2.5}
.pill{fill:var(--ink)}.pill-out{fill:var(--line-strong)}
.edge{fill:none;stroke:var(--ink);stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.road{fill:none;stroke:var(--tomato);stroke-width:8.5;stroke-linecap:round;stroke-linejoin:round}
.disc{fill:var(--sunflower);stroke:var(--ink);stroke-width:2.6}
.strike{fill:none;stroke:var(--tomato);stroke-width:5;stroke-linecap:round}
.t{position:absolute;left:40px;bottom:36px;max-width:420px}
.t h1{margin:0;font:800 88px/.94 var(--font-display);color:var(--ink);letter-spacing:-1.5px}
.t p{margin:16px 0 0;font:400 14px/20px var(--font-text);color:var(--ink-2)}
</style>
<div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: sea 480x288 slab; paper note 304x208 radius-lg, ink hairline; tomato 80x120 radius-lg bleeding off the top; sunflower disc r24 (radius-pill) -->
<!-- arrangement: one tall sea slab carrying the taped note, tomato bleeding off the top-right edge, the sunflower disc low-left like a sun -->
<!-- pattern: literal motif (the shortlist): three list rows of slot + pill, two ticked with the tick-road, one struck out in tomato; chosen because the README names the tick-road and taped note as the core devices -->
<!-- scales: space-7 48 / space-6 32 / space-3 12 steps; radius-lg 18, radius-md 10 for slots, radius-pill for pills and disc -->
<rect class="sea" x="480" y="0" width="480" height="288"/>
<rect class="tom" x="872" y="-18" width="80" height="120" rx="18"/>
<circle class="sun" cx="528" cy="232" r="24"/>
<rect class="paper" x="584" y="44" width="304" height="208" rx="18" transform="rotate(-1.5 736 148)"/>
<rect class="sun" x="616" y="32" width="72" height="22" rx="3" transform="rotate(-4 652 43)"/>
<g transform="rotate(-1.5 736 148)">
<rect class="slot" x="616" y="76" width="36" height="36" rx="10"/>
<g transform="translate(612 68) scale(0.66)"><path class="edge" d="M10 34 L24 48 L52 16"/><path class="road" d="M10 34 L24 48 L52 16"/><circle class="disc" cx="52" cy="14" r="6.8"/></g>
<rect class="pill" x="672" y="88" width="168" height="12" rx="6"/>
<rect class="slot" x="616" y="132" width="36" height="36" rx="10"/>
<g transform="translate(612 124) scale(0.66)"><path class="edge" d="M10 34 L24 48 L52 16"/><path class="road" d="M10 34 L24 48 L52 16"/><circle class="disc" cx="52" cy="14" r="6.8"/></g>
<rect class="pill" x="672" y="144" width="132" height="12" rx="6"/>
<rect class="slot" x="616" y="188" width="36" height="36" rx="10"/>
<rect class="pill-out" x="672" y="200" width="150" height="12" rx="6"/>
<path class="strike" d="M664 208 L 830 202"/>
</g>
</svg>
<div class="t"><h1>EV Shortlist</h1><p>Compare EVs. Make your shortlist.</p></div>
</div>
