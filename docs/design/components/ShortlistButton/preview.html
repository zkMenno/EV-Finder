<div class="evs" style="padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
<button class="evs-pick" aria-pressed="false" data-on="On your shortlist" data-off="Add to shortlist"><svg viewBox="0 0 64 64" aria-hidden="true"><rect class="slot" x="8" y="10" width="44" height="44" rx="10"/><path class="tick-edge" d="M10 34 L24 48 L52 16"/><path class="tick-road" d="M10 34 L24 48 L52 16"/><circle class="tick-sun" cx="52" cy="14" r="6.8"/></svg><span>Add to shortlist</span></button>
<button class="evs-pick" aria-pressed="true" data-on="On your shortlist" data-off="Add to shortlist"><svg viewBox="0 0 64 64" aria-hidden="true"><rect class="slot" x="8" y="10" width="44" height="44" rx="10"/><path class="tick-edge" d="M10 34 L24 48 L52 16"/><path class="tick-road" d="M10 34 L24 48 L52 16"/><circle class="tick-sun" cx="52" cy="14" r="6.8"/></svg><span>On your shortlist</span></button>
<button class="evs-pick evs-pick--icon" aria-pressed="false" aria-label="Add Kia e-Niro to shortlist"><svg viewBox="0 0 64 64" aria-hidden="true"><rect class="slot" x="8" y="10" width="44" height="44" rx="10"/><path class="tick-edge" d="M10 34 L24 48 L52 16"/><path class="tick-road" d="M10 34 L24 48 L52 16"/><circle class="tick-sun" cx="52" cy="14" r="6.8"/></svg></button>
</div><script>document.querySelectorAll('.evs-pick').forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);const s=b.querySelector('span');if(s)s.textContent=on?b.dataset.on:b.dataset.off;}));</script>
