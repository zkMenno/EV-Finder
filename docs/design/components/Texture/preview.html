<!-- @dsCard group="Foundations" height=420 -->
<div class="evs" style="padding:16px;display:grid;gap:14px">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div class="evs-tex evs-tex--paper" style="height:110px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper-sea);padding:12px"><span class="evs-term">Paper grain</span></div>
<div class="evs-tex evs-tex--contour" style="height:110px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper-sea);padding:12px"><span class="evs-term">Contour lines</span></div>
<div class="evs-tex evs-tex--grid" style="height:110px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:12px"><span class="evs-term">Map grid</span></div>
<div class="evs-tex evs-tex--hatch" style="height:110px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:12px"><span class="evs-term">Land hatching</span></div>
<div class="evs-tex evs-tex--halftone" style="height:110px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:12px"><span class="evs-term">Halftone sun</span></div>
<div class="evs-tex evs-tex--fold" style="height:110px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper-sea);padding:12px"><span class="evs-term">Map folds</span></div>
</div>
<div class="evs-route-divider" style="margin:8px 0" role="separator"></div>
<div class="evs-tex evs-tex--paper" style="border-radius:18px;overflow:hidden;background:var(--paper-sea)"><div class="evs-tex evs-tex--contour" style="padding:28px 24px"><p style="margin:0;font:800 30px/34px var(--font-display);color:var(--ink)">Paper + contours, stacked for a hero</p><p class="evs-term" style="margin:6px 0 0">Two wrappers, each with one texture</p></div></div>
</div>
