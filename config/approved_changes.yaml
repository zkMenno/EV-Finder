    reason: "T-136: 'EQ FORFOUR' / 'FORFOUR ED' registrations (~4.5k EEA, ~700 RDW) used to land on the fortwo; they now match the new smart-eq-forfour model, and EEA fortwo spellings got aliases. The fortwo's registration mix changes (RDW registered_count_nl 1751 -> 1040), so its model-band used prices are re-weighted: 2024 bands clear in BE/DE/ES/FR/IT/NL and FR 2017-18 / IT 2017 move ~15 %. Measured: isolated rebuild main seed vs T-136 seed on the same staging (2026-11-18), 21 blocking, all on this variant."
