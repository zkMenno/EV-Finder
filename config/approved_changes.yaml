    reason: "Intended rung upgrade, not a bug. Release 2 built every cell of this variant from the WLTP ratio (rung wltp-ratio, confidence low). Since #135 the town and rural cells use the 8 fueleconomy.gov tests matched to it (vehicles.csv ids 41276, 41277, 42562, 42563, 43665, 43666, 44447, 44448: 'Leaf (62 kW-hr battery pack)' 2019-2022, cityE / highwayE, public domain), rung measured, confidence medium; motorway stays physics. Town/rural wh_km fall about 5-12 % and the p90 edges narrow (e.g. town t3 234.9 -> 210.4, p90 281.8 -> 231.4). Measured: ev verify on staging recorded 2026-11-18, 13 blocking cells, all this variant."
    id: nissan-leaf-ze1-62-kwh
