    file: catalogue.json
    approved_by: "PR #167 (T-148)"
    reason: "T-148: OpenEV's Elroq 'Base' row (77 kWh, i.e. the Elroq 85, but with 150 kW) carried the NL list price 42005 and the used-price model of RDW Elroq 60 records (RDW 'ELROQ 60 150 kW 2026', catalogue price 42005), placed there by power. PR #167 adds seed rows Elroq 50 / 60 (Skoda technical data, 5 May 2025: 60 = 150 kW), so those records now sit on the 60 row and Base's price and used prices clear. A correction, not a loss. Measured: ev verify main vs PR #167 on the same staging (2026-11-18), 2 blocking, both this variant."
