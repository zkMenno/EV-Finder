# "See listings" deep links for this country (T-009, moved here in wave 4).
# Public search URLs only: we link out and never fetch them. No sampling targets, rates or
# partner/affiliate ids here (Decision 004). Every pattern is an unverified guess until someone
# opens it by hand (verified: false, Q-028).
#
# Fields per site:
#   site          stable id
#   label         button text
#   url_template  https URL; placeholders {make} {model} (our slugs), {makeName} {modelName}
#                 (display names), {MAKE} {MODEL} (upper-cased names); all URL-encoded
#   filters       our filter -> query parameters added to the URL (only "electric" today)
#   slug_overrides  our make/model slug -> the site's slug (optional)
#   priority      lower = shown first
#   verified      true only after a manual check of the live site
# Loaded at build time by apps/web/scripts/listings.mjs.
# T-041 (WS3, 2026-11-15): patterns checked against the sites' own URLs as they appear in search
# engine indexes (no site was fetched: "See listings" links are opened by people, never by us)
# and, for La Centrale, Menno's own saved searches (data/editorial, July 2025). `verified` stays
# false until a person taps the link once (checklist: workstreams/WS3/T-041-checklist.md).

country: fr
# UI languages for this country (Decision 015): URLs are /{country}/{lang}/…, and the site serves
# these languages plus English. /{country}/ redirects to default_language. Read by
# apps/web/scripts/countries.mjs.
languages: [fr]
default_language: fr
listings:
  - site: leboncoin
    label: leboncoin
    # evidence: indexed URL https://www.leboncoin.fr/c/voitures/fuel:4+u_car_brand:TESLA+u_car_model:TESLA_Model%20S
    # confirms fuel code 4 = electric. That brand/model form needs leboncoin's own model names, so
    # the free-text search (category 2 = voitures) stays: it forgives name differences.
    url_template: "https://www.leboncoin.fr/recherche?category=2&text={makeName}+{modelName}"
    filters:
      electric: { fuel: "4" }
    priority: 1
    verified: false
  - site: lacentrale
    label: La Centrale
    # evidence: Menno's own La Centrale searches (data/editorial/menno-picks.yaml, July 2025) use
    # exactly listing?makesModelsCommercialNames=MAKE:MODEL&energies=elec (also priceMax,
    # batteryCapacityMin, sortBy=priceAsc). La Centrale's commercial names differ from ours; the
    # overrides below come from his links. NOTE: listings.ts applies slug_overrides to {make} and
    # {model} only, not to {MAKE}/{MODEL}; WS2 asked to apply them here too (values are used as
    # written). Several names joined by ';MAKE:' select several models, as in his links.
    url_template: "https://www.lacentrale.fr/listing?makesModelsCommercialNames={MAKE}%3A{MODEL}"
    filters:
      electric: { energies: elec }
    slug_overrides:
      megane-e-tech-electric: "MEGANE"
      scenic-e-tech: "SCENIC"
      niro-ev: "E-NIRO;KIA:NIRO"
      zs-ev: "MG ZS;MG:ZS"
      xc40-recharge: "XC40"
    priority: 2
    verified: false
  - site: autoscout24-fr
    label: AutoScout24
    # evidence: same /lst/{make}/{model} structure as autoscout24.nl (indexed).
    url_template: "https://www.autoscout24.fr/lst/{make}/{model}"
    filters:
      electric: { fuel: E }
    priority: 3
    verified: false

# "Find a charger / plan a trip" link-out block (T-024; spec docs/spec/charging-buildout.md,
# "Where we link out"). Read by apps/web/scripts/charging-links.mjs (keys: job, label, url, order,
# tool, official, utm, deep_link_template, note). At most five links, in spec order. URLs are
# copied from the spec only. Not yet opened by hand: the web loader has no `verified` key, so
# that is recorded here and in tasks/T-024 (unverified). job values = schema
# CountryChargingLink.job (official-map | local-app | map | route-planner | price-compare).
charging_links:
  - {order: 1, job: map, tool: chargemap, label: Chargemap, url: "https://chargemap.com/"}
  - {order: 2, job: route-planner, tool: abrp, label: "A Better Routeplanner (ABRP)", url: "https://abetterrouteplanner.com/"}
  - {order: 3, job: price-compare, tool: chargeprice, label: Chargeprice, url: "https://www.chargeprice.app/"}
  - {order: 4, job: map, tool: electromaps, label: Electromaps, url: "https://www.electromaps.com/"}
