# "See listings" deep links for this country (T-009, moved here in wave 4).
# Public search URLs only: we link out and never fetch them. No sampling targets, rates or
# partner/affiliate ids here (Decision 004). Every pattern is an unverified guess until someone
# opens it by hand (verified: false, Q-028).
#
# Fields per site:
#   site          stable id
#   label         button text
#   url_template  https URL; placeholders {make} {model} (our slugs), {makeName} {modelName}
#                 (display names), {MAKE} {MODEL} (upper-cased names); all URL-encoded
#   filters       our filter -> query parameters added to the URL (only "electric" today)
#   slug_overrides  our make/model slug -> the site's slug (optional)
#   priority      lower = shown first
#   verified      true only after a manual check of the live site
# Loaded at build time by apps/web/scripts/listings.mjs.

country: be
listings:
  - site: 2dehands
    label: 2dehands
    url_template: "https://www.2dehands.be/q/{makeName}+{modelName}/"
    filters: {}
    priority: 1
    verified: false
  - site: autoscout24-be
    label: AutoScout24
    url_template: "https://www.autoscout24.be/nl/lst/{make}/{model}"
    filters:
      electric: { fuel: E }
    priority: 2
    verified: false

# "Find a charger / plan a trip" link-out block (T-024; spec docs/spec/charging-buildout.md,
# "Where we link out"). Read by apps/web/scripts/charging-links.mjs (keys: job, label, url, order,
# tool, official, utm, deep_link_template, note). At most five links, in spec order. URLs are
# copied from the spec only. Not yet opened by hand: the web loader has no `verified` key, so
# that is recorded here and in tasks/T-024 (unverified). job values = schema
# CountryChargingLink.job (official-map | local-app | map | route-planner | price-compare).
# BE: no official map found (spec open question), so Chargemap goes first.
charging_links:
  - {order: 1, job: map, tool: chargemap, label: Chargemap, url: "https://chargemap.com/"}
  - {order: 2, job: route-planner, tool: abrp, label: "A Better Routeplanner (ABRP)", url: "https://abetterrouteplanner.com/"}
  - {order: 3, job: price-compare, tool: chargeprice, label: Chargeprice, url: "https://www.chargeprice.app/"}
  - {order: 4, job: map, tool: plugshare, label: PlugShare, url: "https://www.plugshare.com/"}
