# Shortlist rules, derived from Menno's own picks (data/editorial/menno-picks.yaml, Nov 2026).
# Rules are rows, not code (Decision 038). Back-test: python3 -I data/editorial/backtest_rules.py
#
# How a car is scored for one profile:
#   1. gates: fail one → "ruled out" with the gate's reason (plain words, shown to users)
#   2. factors: each maps a value onto 0..1 between `poor` and `great` (linear, clamped), times its weight
#   3. bonuses / penalties: small fixed points with a reason
#   4. score 0..100 → band (shortlist / consider / fallback)
# Price is NOT a factor. Menno sorted quality first and put price in its own group
# ("awesome, yet expensive"). The app filters or splits by budget after scoring.
#
# `field` = PublishedVariant field the app will read. `sheet_field` = the column used in the
# back-test (Menno's sheet values, internal only). `status: gap` = field not in the schema yet
# (schema request T-066); the factor scores 0.5 (neutral) until the data exists, never a guess.
schema: shortlist-rules/v1
derived_from: data/editorial/menno-picks.yaml
review: true   # agent-derived from 41 rows of one person's picks; Menno to confirm thresholds

profiles:
  # ── 1. Road-tripper ─────────────────────────────────────────────────────────────────────
  - id: road-tripper
    aliases: [only-car-long-trips]
    label: {en: "Main car that also does the road trips", nl: "Hoofdauto die ook de vakanties rijdt"}
    short: {en: "Your only or main car, and it drives you on holiday too. Fast charging and winter range come first."}
    picker: {car_role: [only, main], long_trips: [monthly, often, few_a_year]}
    matches_usage_profile: only-car-often-long   # data/taxonomy/usage_profiles.yaml (trip-fit §6)
    calibration: "Back-tested on Menno's 'EVs top tier' tab (research/R-32): 80% band match on 30 cars"
    origin: "Menno's 'EVs top tier' tab: primary car, quick charging, Dutch + French used market"
    # Bands per voltage class: Menno holds 800 V cars to a higher bar and judges 400 V cars
    # against each other (his tab is split into 800 V and 400 V sections; the best 400 V cars,
    # L03 / ID.7 Pro S / Zeekr 001, are green even though they charge slower than 'fallback' 800 V cars).
    bands:
      800v: {shortlist: 68, consider: 63}
      400v: {shortlist: 52, consider: 45}
      default: {shortlist: 60, consider: 50}

    gates:
      - id: dc-not-terrible
        field: dc_km_per_20min
        sheet_field: dc_km_per_h
        min_km_per_h: 300
        reason: {en: "Fast charging is too slow for long trips (adds less than 100 km in 20 minutes)."}
        evidence: "OTHER EVs tab: Ampera-e, Zoe, Leaf, MG5 greyed out as 'Terrible DC charging'."
      - id: winter-range-floor
        field: real_range_km   # winter figure once Trip fit's consumption model lands
        sheet_field: range_winter_km
        min_km: 250
        reason: {en: "Under 250 km in winter: too short as your only car."}
        evidence: "Used EVs tab: 54 kWh IONIQ 5 / EV6 (250-255 km winter) were the lowest tier (A4) despite fast charging."

    factors:
      # Units (WS2 ask, 2026-11-15): the schema has no `unit` key. Convention: a gate or factor
      # with `sheet_field: dc_km_per_h` (or `min_km_per_h`) is in km per HOUR, i.e. field x 3;
      # without it, numbers are in the field's own unit (dc_km_per_20min = km per 20 min).
      - id: dc-speed
        label: {en: "Fast-charging speed (km added per hour, 10-80%)"}
        field: dc_km_per_20min       # x3 = km per hour
        sheet_field: dc_km_per_h
        poor: 450
        great: 1300
        weight: 30
        evidence: "Strongest signal. Every A/B-tier car charges at 1,100+ km/h; older versions of the same cars
          (960-1,070 km/h) drop to 'fallback'. Menno measures it in km/h, not kW (same idea as Decision 009)."
      - id: winter-range
        label: {en: "Winter range"}
        field: real_range_km
        sheet_field: range_winter_km
        poor: 300
        great: 430
        weight: 20
        evidence: "Shortlist cars sit at 380-465 km winter; 'consider' 400 V cars with ~370-395 km."
      - id: space
        label: {en: "Boot plus frunk"}
        field: boot_l                # + frunk_l (gap)
        sheet_field: [boot_l, frunk_l]
        poor: 380
        great: 600
        weight: 12
        evidence: "MG4 (363 L) stays 'fallback'; IONIQ 6 (401 + 45 L) only 'watching'; estates/wagons get
          yellow in the era tab (e-308 SW, Astra Sports Tourer) and dominate his petrol shortlist."
      - id: efficiency
        label: {en: "Efficiency"}
        field: consumption_kwh_100km   # x10 = Wh/km
        sheet_field: efficiency_wh_km
        poor: 290
        great: 210
        weight: 10
        evidence: "Picks cluster at 212-240 Wh/km (P7+, 7GT, ID.7, G6); 270+ is tolerated only with very fast charging."
      - id: one-pedal
        label: {en: "Strong regen / one-pedal driving"}
        field: one_pedal
        status: gap
        sheet_field: notes_one_pedal
        weight: 10
        evidence: "IM6 demoted to C-tier with the note 'Weak regen / No one-pedal driving'; every note on a
          shortlisted car names its regen control (flippers + i-Pedal, Xpedal, one-pedal). Used tab has a '1-pedal' column."
      - id: v2l
        label: {en: "Power out (V2L)"}
        field: bidi                  # bidi.modes contains v2l
        sheet_field: v2l
        weight: 5
        evidence: "All 800 V shortlist cars have V2L; the two 'watching' 800 V cars without it (CLA, A6) stay unrated."
      - id: home-power
        label: {en: "Can power a home or the grid (V2H / V2G)"}
        field: bidi
        sheet_field: [v2h, v2g]
        weight: 5
        evidence: "Called out with '!' in notes on EX60, iX3, Megane 2026 ('V2H, AC @ 11kw!')."
      - id: ac-speed
        label: {en: "Home charging speed (AC)"}
        field: ac_kw
        sheet_field: ac_kw
        poor: 7
        great: 22
        weight: 4
        evidence: "MG4 (6.6 kW) is 'fallback'; 22 kW noted as a plus (Zeekr, Volvo, Megane 2022)."

    bonuses:
      - id: newest-version
        points: 4
        rule: "Newest model year of a model that also appears in an older version (same model, later battery/charging update)."
        evidence: "G6 2025 (A) vs 2024 (C); EV6 2024 (A) vs 2021 (C); IONIQ 5 2024 (B) vs 2022 (C)."
      - id: lfp-daily-100
        points: 2
        field: charge_100_daily
        sheet_field: chemistry
        rule: "LFP battery: charge to 100% every day without worry."
        evidence: "Three of the top-tier picks are LFP (G6 2025, P7+, L03); Menno tracks chemistry per car."

    penalties:
      - id: too-big-for-b-roads
        points: -16
        applies_with: rural   # Menno lives rural; in the app this comes from the rural modifier
        field: [length_mm, kerb_mass_kg]   # width_mm is a gap
        status: calibrate
        rule: "Wide or heavy SUV (width over ~1.95 m or kerb mass over ~2,300 kg) on narrow rural roads."
        sheet_rule: "notes contain 'chubby'"
        evidence: "Zeekr 7X: 'Quite chubby for B roads', C-tier despite 1,330 km/h charging."
      - id: older-version
        points: -6
        rule: "An older version of a model that has a newer, better-charging version on the list."
        evidence: "Same pairs as newest-version."

    filter_presets:   # preselected in Explore, shown as removable chips "Set by your profile"
      - {field: dc_km_per_20min, min: 200, why: {en: "Adds 200+ km in 20 minutes of fast charging"}}
      - {field: real_range_km, min: 350, why: {en: "350+ km real range (about 280+ in winter)"}}
      - {field: boot_l, min: 380, why: {en: "Room for holiday luggage"}}

    not_rules:
      - "Looks ('Ugly' on iX3) and small annoyances (rear-only parking sensors on the G6): personal, shown as owner notes, never scored."
      - "ADAS level and software (Level 3 ADAS, Android Automotive, OTA) matter to Menno but have no source field yet; candidates for a later 'tech' factor."
      - "Price: separate axis. Used-market prices and availability differ by country (NL vs FR) and moved after the 2026 oil shock."

  # ── 2. Daily driver ─────────────────────────────────────────────────────────────────────
  - id: daily-driver
    label: {en: "Main car for every day, holidays another way", nl: "Hoofdauto voor elke dag, vakantie op een andere manier"}
    short: {en: "Commuting, school runs and shopping. For holidays you take the train, rent or borrow a car."}
    picker: {car_role: [only, main], long_trips: [never]}
    matches_usage_profile: main-car-no-road-trips   # new row for usage_profiles (T-066)
    calibration: "Research thresholds only (research/R-33); not yet back-tested"
    bands: {default: {shortlist: 62, consider: 48}}
    gates:
      - id: winter-range-daily
        field: real_range_km
        min_km: 200
        rural_min_km: 250
        reason: {en: "Under 200 km real range (250 km in the countryside): your longest normal day plus a cold morning would be tight."}
        evidence: "Longest regular day ≈ 2× rural commute (29 km one way in FR) + errands; keep 40% for winter and battery wear."
    factors:
      - {id: winter-range, field: real_range_km, poor: 200, great: 380, weight: 18}
      - {id: space, field: boot_l, poor: 300, great: 550, weight: 16}
      - {id: efficiency, field: consumption_kwh_100km, poor: 220, great: 140, weight: 14, note: "kWh/100 km x10 = Wh/km; poor/great in Wh/km"}
      - {id: dc-speed, field: dc_km_per_20min, poor: 80, great: 220, weight: 10, note: "Occasional rescue charge, not a priority. Values in km added per 20 min (no sheet_field: field unit)"}
      - {id: ac-speed, field: ac_kw, poor: 3.7, great: 11, weight: 8}
      - {id: one-pedal, field: one_pedal, status: gap, weight: 8}
      - {id: heat-pump, field: heat_pump, weight: 8, note: "standard = 1, option = 0.6 (check the car), none = 0, not disclosed = 0.5"}
      - {id: battery-health-risk, field: cooling_id, weight: 10, note: "air-cooled pack = 0, liquid = 1; used cars only"}
      - {id: v2l, field: bidi, weight: 4}
      - {id: home-power, field: bidi, weight: 4}
    filter_presets:
      - {field: real_range_km, min: 250, why: {en: "250+ km real range covers a long working day in winter"}}
      - {field: boot_l, min: 300, why: {en: "Room for a weekly shop or a pram"}}

  # ── 3. Runabout ─────────────────────────────────────────────────────────────────────────
  - id: runabout
    label: {en: "Second car for short trips", nl: "Tweede auto voor korte ritten"}
    short: {en: "The household's second car: work, school, shops. The other car does the long trips."}
    picker: {car_role: [second]}
    matches_usage_profile: second-car-town-home   # usage_profiles row (trip-fit §6)
    calibration: "Research thresholds only (research/R-33); not yet back-tested"
    bands: {default: {shortlist: 60, consider: 45}}
    gates:
      - id: winter-range-runabout
        field: real_range_km
        min_km: 120
        rural_min_km: 160
        reason: {en: "Under 120 km real range (160 km in the countryside): too little for a cold day of errands."}
        evidence: "Second cars: 220 km nominal range covers all driving for ~70% of them (Jakobsson et al. 2016)."
    factors:
      - {id: size, field: length_mm, poor: 4500, great: 3700, weight: 18, note: "Shorter = easier to park; urban modifier doubles it"}
      - {id: efficiency, field: consumption_kwh_100km, poor: 200, great: 130, weight: 18}
      - {id: battery-health-risk, field: cooling_id, weight: 16, note: "Old cheap EVs: air-cooled packs and 2013-2018 cars are the risk"}
      - {id: winter-range, field: real_range_km, poor: 120, great: 280, weight: 14}
      - {id: ac-speed, field: ac_kw, poor: 3.7, great: 11, weight: 8, note: "Zoe 22 kW AC is a plus where 22 kW posts exist"}
      - {id: heat-pump, field: heat_pump, weight: 8}
      - {id: dc-speed, field: dc_km_per_20min, poor: 0, great: 120, weight: 6, note: "Nice to have; no DC at all is allowed here. Values in km added per 20 min (no sheet_field: field unit)"}
      - {id: space, field: boot_l, poor: 200, great: 400, weight: 6}
    filter_presets:
      - {field: real_range_km, min: 150, why: {en: "150+ km real range: a full day of errands, even in winter"}}
      - {field: length_mm, max: 4300, why: {en: "Small enough for town parking"}}
    sort_default: price_used_asc

  # ── 4. Kerbside charger (no driveway) ───────────────────────────────────────────────────
  - id: kerbside-charger
    label: {en: "No charger at home", nl: "Geen laadpaal thuis"}
    short: {en: "You park on the street or in a shared garage and charge at public points, work or the supermarket."}
    picker: {charge_where: [public_only, work]}
    combines_with: [road-tripper, daily-driver, runabout]   # sets charging weights on top of the trip profile
    matches_usage_profile: public-charging-only   # usage_profiles row (trip-fit §6)
    calibration: "Research thresholds only (research/R-33); not yet back-tested"
    why_a_profile: "17% of EV drivers in FR and Europe have no home charger; in French towns a third of car-owning
      households have no private parking. They pay more per kWh and plan charging around shopping or work."
    weight_steps:   # applied to the trip profile it combines with
      efficiency: +2
      dc-speed: +1
      ac-speed: +1
      winter-range: +1
    extra_factors:
      - {id: fast-on-400v, field: fast_on_400v, weight: 8, note: "Most supermarket and town fast chargers are 50-150 kW, 400 V"}
      - {id: lfp-daily-100, field: charge_100_daily, weight: 4, note: "Fill to 100% at each session, fewer sessions per week"}
    filter_presets:
      - {field: dc_km_per_20min, min: 120, why: {en: "Adds 120+ km during a 20-minute shop"}}
      - {field: ac_kw, min: 11, why: {en: "Uses the full speed of 11 kW street posts"}}

# Where you live: changes thresholds and weights of any profile. Picker question `home_area`.
modifiers:
  - id: urban
    label: {en: "City"}
    picker: {home_area: [city]}
    weight_steps: {size: +1, winter-range: -1, efficiency: +1}
    gate_scale: 1.0
    hints:
      - "No driveway is likely: offer the kerbside-charger profile."
      - "Daily car km are lowest in dense areas (NL West 14 km/person/day vs 23 in Drenthe)."
  - id: suburban
    label: {en: "Town or suburb"}
    picker: {home_area: [town]}
    weight_steps: {}
    gate_scale: 1.0
  - id: rural
    label: {en: "Countryside"}
    picker: {home_area: [countryside]}
    use_rural_gates: true      # gates with rural_min_km use that value
    weight_steps: {winter-range: +1, heat-pump: +1, ac-speed: +1}
    penalties:
      - {id: too-big-for-b-roads, points: -8, field: [length_mm, kerb_mass_kg], status: calibrate,
         rule: "Wide or heavy SUV on narrow lanes (width > ~1.95 m, a gap field)"}
    hints:
      - "Home charging is easy in detached houses; public chargers off the main roads are sparse."
      - "Longer daily trips: rural households drive most of their km on 10-100 km trips."
      - "Unpaved tracks or steep lanes: tick 'Snow / mountain roads' for ground clearance and AWD."

# Ticked extras, any profile. Mirrors the trip-fit picker 'Extras'.
addons:
  - id: high-mileage
    label: {en: "I drive a lot (25,000+ km a year)"}
    weight_steps: {efficiency: +2, battery-health-risk: +1, dc-speed: +1}
    notes: "Battery wear follows charge cycles and heat more than km; LFP and liquid cooling age best. Warranty km left matters on used cars."
  - id: family-full-car
    label: {en: "Often a full car"}
    weight_steps: {space: +2}
    filter_presets: [{field: seats, min: 5}, {field: boot_l, min: 450}]
  - id: tow
    label: {en: "I tow a trailer or caravan"}
    filter_presets: [{field: towing_kg, min: 1000}]
    notes: "Towing roughly halves motorway range (calibrate from tests, trip-fit 🔴)."
  - id: snow-mountain
    label: {en: "Snow, steep or unpaved roads"}
    weight_steps: {heat-pump: +1}
    prefer: {drivetrain: [awd]}
  - id: keep-8-years
    label: {en: "Keep it 8+ years"}
    weight_steps: {battery-health-risk: +1}
    prefer: {voltage_class_id: [800v], chemistry_id: [lfp]}
  - id: used-budget
    label: {en: "Buying used, fixed budget"}
    origin: "Menno's 'Used EVs' tab, July 2025, La Centrale FR, EUR 15-20k / 20-25k / 25-30k bands"
    status: draft
    notes: >
      Score inside one price band at a time, plus market supply. His July 2025 order per band:
      15-20k: Model 3 LR > Megane 60 / MG4 / Enyaq 60 / ZS EV > e-Niro / Niro EV / ID.3; 25-30k: EV6 74 / IONIQ 5 74 >
      Model Y / Enyaq 80 > ID.4 / Scenic / Ariya. Ruled out: Kona, e-Soul, MG5, Leaf (slow DC).
    extra_factors:
      - {id: supply, field: registrations, weight: 8, note: "Proxy until listing counts exist (layer 3 stays off, Decision 004)"}
      - {id: model-year-floor, field: year_start, weight: 4, note: "'2021+' listed as a pro, '2019+' as a con"}

# Weight steps: one step = x1.5 on that factor's weight (+2 = x2.25, -1 = x0.67), then renormalised.
weight_step_factor: 1.5

# Picker (4 taps). Answer ids line up with docs/spec/trip-fit.md §4; `home_area` is new (Decision 050).
picker:
  - id: car_role
    question: {en: "This car will be"}
    answers: [only, main, second]
  - id: long_trips
    question: {en: "Long trips (300 km+) in this car"}
    answers: [never, few_a_year, monthly, often]
    skip_if: {car_role: [second]}
  - id: charge_where
    question: {en: "Where you'll charge"}
    answers: [home, work, public_only]
  - id: home_area
    question: {en: "Where you live"}
    answers: [city, town, countryside]
