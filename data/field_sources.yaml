# Which sources feed which field (Decision 009, provisional).
# primary: 1–2 source ids, tried first. fallbacks: in order. tolerance: values within it "agree".
# merge: priority (first available in order) | median (of agreeing values) | newest (most recent retrieval).
# Conflicts outside tolerance go to data/review/conflicts.csv and are never averaged.
# agreement_wins (default true, A-05 F1 c): in priority mode 2+ agreeing independent origins
#   outvote the priority winner (one blended RDW year group no longer beats OpenEV + TGK).
# needs_backing: [ids] (A-05 F9): a value whose only agreeing sources are these goes to review.
# cited_wins (default true): a cited value (seed `cited:` / manual fact, medium+ confidence) beats
#   a value only ONE independent origin backs; 2+ agreeing origins still beat it (it goes to review).
schema: field-sources/v1
fields:
  names_years:       {primary: [eea, rdw], fallbacks: [openev, wikidata, maker-docs], merge: priority}
  body:              {primary: [rdw], fallbacks: [eea, euroncap, wikidata, maker-docs], merge: priority}
  seats:             {primary: [rdw], fallbacks: [eea, euroncap, wikidata, maker-docs], tolerance: {abs: 0}, merge: priority}
  length_mm:         {primary: [rdw], fallbacks: [eea, euroncap, wikidata, maker-docs, openev, seed-manual], tolerance: {abs: 10, unit: mm}, merge: priority}
  width_mm:          {primary: [rdw], fallbacks: [eea, euroncap, wikidata, maker-docs, openev, seed-manual], tolerance: {abs: 10, unit: mm}, merge: priority}
  wheelbase_mm:      {primary: [rdw], fallbacks: [eea, euroncap, wikidata, maker-docs, openev, seed-manual], tolerance: {abs: 10, unit: mm}, merge: priority}
  weight_kg:         {primary: [rdw], fallbacks: [eea, euroncap, wikidata, maker-docs, openev, ademe, seed-manual], tolerance: {pct: 1}, merge: priority,
                      note: "ADEME 'poids a vide' = Masse OM - 75 kg (no driver)."}
  towing_kg:         {primary: [rdw], fallbacks: [eea, maker-docs, openev, seed-manual], tolerance: {pct: 1}, merge: priority}
  power_kw:          {primary: [eea, rdw], fallbacks: [openev, fueleconomy, seed-manual], tolerance: {pct: 2}, merge: priority}
  drivetrain:        {primary: [eea, rdw], fallbacks: [openev, fueleconomy, seed-manual], merge: priority}
  battery_kwh_net:   {primary: [openev, maker-docs], fallbacks: [kilowatt-openev, nyland, naf, adac, seed-manual], tolerance: {pct: 2}, merge: median}
  battery_kwh_gross: {primary: [openev, maker-docs], fallbacks: [nyland, naf, adac, seed-manual], tolerance: {pct: 2}, merge: median}
  ac_kw:             {primary: [openev, kilowatt-openev], fallbacks: [maker-docs, fastned, seed-manual], tolerance: {pct: 2}, merge: priority}
  dc_curve:          {primary: [fastned], fallbacks: [kilowatt-openev, openev, nyland, model-estimate], merge: priority,
                      note: "OpenEV only where not a default curve; then same platform/pack; else generic shape (estimated)."}
  dc_peak_kw:        {primary: [fastned, openev], fallbacks: [kilowatt-openev, maker-docs, seed-manual], tolerance: {pct: 5}, merge: priority,
                      needs_backing: [kilowatt-openev],
                      note: "A-05 F9: KilowattApp alone is not enough (Zoe Ph1 R110: 150 kW on a car without DC)."}
  dc_avg_10_80_kw:   {primary: [naf, adac], fallbacks: [automobile-propre, model-estimate, maker-docs], tolerance: {pct: 5}, merge: median,
                      note: "Derived from the curve when present; maker figures labelled 'claim'."}
  dc_minutes_10_80:  {primary: [naf, adac], fallbacks: [automobile-propre, model-estimate, maker-docs], tolerance: {abs: 2, unit: min}, merge: median}
  # A-05 F1: rdw stays first (its type-split records are per-version plate values), but its
  # year-group records no longer land on a trim by a missing name, and agreement_wins lets
  # OpenEV + TGK outvote a single RDW value.
  wltp_range_km:     {primary: [eea, rdw], fallbacks: [rdw-tgk, maker-docs, openev, ademe, seed-manual], tolerance: {pct: 2}, merge: priority,
                      note: "ADEME holds the best case (highest range) of each WLTP interpolation family."}
  consumption_kwh_100km: {primary: [eea, rdw], fallbacks: [rdw-tgk, maker-docs, openev, ademe, seed-manual], tolerance: {pct: 3}, merge: priority,
                      note: "ADEME holds the best case (lowest consumption) of each WLTP family."}
  epa_range_km:      {primary: [fueleconomy], fallbacks: [openev, seed-manual], tolerance: {pct: 2}, merge: priority}
  real_range_summer_km:   {primary: [nyland, naf], fallbacks: [adac, edmunds, insideevs, consumer-reports, model-estimate], tolerance: {pct: 5}, merge: median}
  real_range_motorway_km: {primary: [nyland, naf], fallbacks: [adac, edmunds, insideevs, consumer-reports, model-estimate], tolerance: {pct: 5}, merge: median}
  real_range_winter_km:   {primary: [nyland, naf], fallbacks: [adac, edmunds, insideevs, consumer-reports, model-estimate], tolerance: {pct: 5}, merge: median}
  real_range_km:     {primary: [nyland, naf], fallbacks: [adac, edmunds, insideevs, consumer-reports, model-estimate], tolerance: {pct: 5}, merge: median}
  consumption_motorway_kwh_100km: {primary: [spritmonitor, adac], fallbacks: [model-estimate], tolerance: {pct: 5}, merge: median,
                      note: "Fallback = WLTP consumption x ratio (estimate)."}
  price_new_nl:      {primary: [rdw], fallbacks: [maker-docs], merge: newest, note: "RDW catalogusprijs."}
  price_new_fr:      {primary: [ademe], fallbacks: [maker-docs, openev], merge: priority, note: "ADEME Car Labelling list price (EUR, FR)."}
  price_new_other:   {primary: [maker-docs], fallbacks: [], merge: newest, note: "Manual price lists per country."}
  registered_count:  {primary: [rdw, dft-veh, dft-veh0160], fallbacks: [kba-fz10, kba, sdes, eea], merge: newest,
                      note: "Not merged: each source/period/kind is its own RegistrationCount (registrations.<country>); never summed across sources."}
  inspection_defects: {primary: [rdw, dvsa-mot], fallbacks: [], merge: newest}
  battery_health:    {primary: [aviloo], fallbacks: [recurrent, model-estimate], merge: newest, note: "Fallback: generic chemistry curve (estimate)."}
  recalls:           {primary: [rdw, dvsa-mot, nhtsa], fallbacks: [eu-safety-gate], merge: newest}
  boot_l:            {primary: [maker-docs], fallbacks: [openev, seed-manual], tolerance: {pct: 2}, merge: priority, note: "Manual; cite URL + date."}
  accel_0_100_s:     {primary: [maker-docs], fallbacks: [openev, seed-manual], tolerance: {abs: 0.2, unit: s}, merge: priority}
  heat_pump:         {primary: [maker-docs], fallbacks: [openev], merge: priority}
  warranty:          {primary: [maker-docs], fallbacks: [], merge: newest}
  # Decision 023 (R-08): type-approval values from RDW TGK; never fill WLTP / kerb weight / peak power.
  nedc_range_km:     {primary: [rdw-tgk], fallbacks: [maker-docs, seed-manual], tolerance: {pct: 2}, merge: priority}
  nedc_consumption_kwh_100km: {primary: [rdw-tgk], fallbacks: [maker-docs], tolerance: {pct: 3}, merge: priority}
  wltp_range_km_worst: {primary: [rdw-tgk], fallbacks: [], tolerance: {pct: 2}, merge: priority}
  wltp_consumption_kwh_100km_worst: {primary: [rdw-tgk], fallbacks: [], tolerance: {pct: 3}, merge: priority}
  mass_running_order_kg: {primary: [rdw-tgk], fallbacks: [], tolerance: {pct: 1}, merge: priority}
  power_30min_kw:    {primary: [rdw-tgk], fallbacks: [], tolerance: {pct: 2}, merge: priority}
  height_mm:         {primary: [rdw-tgk], fallbacks: [openev, seed-manual], tolerance: {abs: 10, unit: mm}, merge: priority}
  top_speed_kmh:     {primary: [rdw-tgk], fallbacks: [openev, kilowatt-openev, seed-manual], tolerance: {pct: 2}, merge: priority}
