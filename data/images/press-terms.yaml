# Maker press/media photo terms, one row per seed make (T-133, Decision 081).
#
# Our use: one photo per generation on a free car-finder site (cards and model pages), to identify
# the car. We are not a news outlet, and affiliate links are planned (WS5), so the site is not
# purely non-commercial either.
#
# verdict:
#   allowed      the terms clearly cover our use: the maker photo may be used
#   not_allowed  the terms limit use to journalists / news media, or forbid copying without
#                written permission: never use, fall back to Wikimedia Commons
#   unclear      "editorial use only" or similar, without saying who may use it; or terms not
#                found. Decision 081: unclear = not used (Commons fallback)
#
# A maker moves to `allowed` only with written permission (an email from the press office,
# requested in Menno's name: a draft for him, never sent by an agent) or terms that name our use.
# quote: a short extract (under 25 words) of the clause the verdict rests on, never the full terms.
# Re-check every 6 months (terms change); checked_at = the date a person or agent read the clause.
# photo_hosts: hosts the press files would come from; empty while no maker is allowed (WS1 adds them to
# data/sources.yaml `maker-press-photos`, T-134 contract).
schema: images-press-terms/v1
checked_by: WS3 (2nd chat, 2026-11-17)
