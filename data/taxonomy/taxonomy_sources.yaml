  - id: bmw-press-ix3-v2g-2026-02-09
    name: "BMW Group press release: iX3 V2G with E.ON (2026-02-09)"
    licence: none (facts cited by URL and date)
  - id: electrive-vw-elli-v2g-2026-06-23
    name: "electrive: VW / Elli V2G (2026-06-23)"
    licence: none (facts cited by URL and date)
  - id: tmh-v2g-capable-cars
    name: The Mobility House, which cars are V2G-capable
    url: https://mobilityhouse-energy.com/int_en/knowledge-center/article/which-cars-are-v2g-capable
    licence: none (facts cited by URL and date)
  - id: cali-energy-us-v2h
