# Glossary terms for UI tooltips (ⓘ) and /learn/[term] pages (Decision 010). Rows = schema $defs/GlossaryTerm.
# label = plain language; technical = name shown underneath; short = tooltip (max 20 words, enforced);
# long = learn page (2-4 sentences); nerd_note = Nerd mode extra. EN complete; NL for label + short.
# `related` may point to other glossary ids or to chemistry / cooling / voltage-class ids.
# Validate: python3 -I data/taxonomy/validate_taxonomy.py
glossary_terms:
  - id: wltp
    label: {en: "Official range", nl: "Officiële actieradius"}
    technical: {en: "WLTP range"}
    short:
      en: "The range from the official EU lab test. Real-world range is usually lower, especially in winter and on motorways."
      nl: "Het bereik uit de officiële EU-labtest. In de praktijk meestal lager, vooral in de winter en op de snelweg."
    long:
      en: >-
        WLTP is the standard test cycle used in Europe to rate range and consumption. It is useful
        for comparing cars with each other, but it is run in mild conditions with a mix of slow and
        fast driving. Most cars get noticeably less in daily use, which is why we also show our own
        real-world range.
    nerd_note:
      en: "WLTP replaced NEDC from 2017-2018; NEDC figures for older cars are far more optimistic and are never mixed with WLTP here."
    related: [real-range, consumption, era]

  - id: real-range
    label: {en: "Real-world range", nl: "Praktijkbereik"}
    technical: {en: "Estimated real-world range"}
    short:
      en: "How far the car is likely to go in normal driving, from our own data and calculations."
      nl: "Hoe ver de auto waarschijnlijk komt bij normaal rijden, op basis van onze eigen data en berekeningen."
    long:
      en: >-
        Our real-world range is an estimate of what an average driver gets on a full battery in
        mixed driving. It comes from owner data or tests where we have them, and from a fallback
        calculation where we do not. The figure always shows which method produced it.
    nerd_note:
      en: "Computed on usable capacity, not gross. The method used is the real-range rung (see that term)."
    related: [real-range-rung, wltp, consumption, usable-vs-gross, estimate]

  - id: real-range-rung
    label: {en: "How we got this range", nl: "Hoe we dit bereik bepaalden"}
    technical: {en: "Real-range fallback rung"}
    short:
      en: "Which method produced the real-world range: owner data, a direct test, or an estimate from similar cars."
      nl: "Welke methode het praktijkbereik gaf: eigenaardata, een directe test of een schatting op basis van vergelijkbare auto's."
    long:
      en: >-
        We use a ladder of methods for real-world range and take the best one available. The top
        rung is owner data, then a direct test of this exact variant, then a sibling variant, then
        a ratio for similar cars by brand, body and drivetrain, and finally a ratio by body type.
        Lower rungs are less precise, so we show which one was used.
    nerd_note:
      en: "Rungs in order: owner-data, exact-test, sibling-variant, brand-body-drivetrain-ratio, body-ratio."
    related: [real-range, estimate, confidence]

  - id: consumption
    label: {en: "Energy use", nl: "Verbruik"}
    technical: {en: "Consumption (kWh/100 km)"}
    short:
      en: "How much electricity the car uses per 100 km. Lower is better, like litres per 100 km."
      nl: "Hoeveel stroom de auto per 100 km verbruikt. Lager is beter, net als liters per 100 km."
    long:
      en: >-
        Consumption tells you how efficient a car is. A small, aerodynamic car may use around 14
        kWh per 100 km, a big SUV 20 or more. It drives your running costs and, together with
        battery size, your range.
    nerd_note:
      en: "Stored internally as Wh/km. Lab figures usually include charging losses; trip-computer figures usually do not."
    related: [wltp, real-range, heat-pump]

  - id: ac-charging
    label: {en: "Home and street charging", nl: "Thuis en aan de paal laden"}
    technical: {en: "AC charging (kW)"}
    short:
      en: "Slower charging at home or at street posts. The car's onboard charger sets the maximum speed."
      nl: "Langzamer laden thuis of aan een laadpaal. De lader in de auto bepaalt de maximale snelheid."
    long:
      en: >-
        AC charging uses the car's built-in charger to turn mains power into battery power. Typical
        limits are 7.4 kW on one phase or 11 kW on three phases; some cars allow 22 kW. It is what
        you use overnight or at work, so the car's limit matters more than the post's.
    nerd_note:
      en: "Some older cars only charge on one phase (around 3.7 or 7.4 kW), which is slow on 3-phase posts common in the Netherlands."
    related: [dc-charging, preconditioning]

  - id: dc-charging
    label: {en: "Fast charging", nl: "Snelladen"}
    technical: {en: "DC fast charging (kW)"}
    short:
      en: "Fast charging on the road, bypassing the car's onboard charger. Speed depends on the car and the charger."
      nl: "Snel laden onderweg, buiten de lader in de auto om. De snelheid hangt af van auto en laadpaal."
    long:
      en: >-
        DC fast chargers feed power straight into the battery, which allows much higher speeds than
        AC. How fast a car really charges depends on its charge curve, battery temperature and the
        charger's own limits. Some older or cheaper cars have no fast-charging socket at all.
    nerd_note:
      en: "Plugs: CCS2 is the European standard; older Nissan, Mitsubishi and Kia models used CHAdeMO, which fewer new chargers support."
    related: [charge-curve, peak-kw, 10-80, dc-km-20min, voltage-class]

  - id: dc-km-20min
    label: {en: "Range added in 20 minutes", nl: "Bereik erbij in 20 minuten"}
    technical: {en: "DC km per 20 min"}
    short:
      en: "How many kilometres of real-world range a fast charger adds in 20 minutes. The most practical charging number."
      nl: "Hoeveel kilometer praktijkbereik een snellader in 20 minuten toevoegt. Het meest praktische laadgetal."
    long:
      en: >-
        Peak charging power alone says little about a road trip. This figure combines how fast the
        battery charges with how efficient the car is, giving the kilometres you get back during a
        typical coffee stop. It assumes a suitable charger and a warm battery.
    nerd_note:
      en: "Derived from the charge curve and real-world consumption; starting state of charge assumed around 10 %."
    related: [charge-curve, 10-80, consumption, estimate]

  - id: charge-curve
    label: {en: "Charging speed over time", nl: "Laadsnelheid in de tijd"}
    technical: {en: "Charge curve"}
    short:
      en: "How charging power changes as the battery fills. A flat, high curve means quick stops."
      nl: "Hoe het laadvermogen verandert terwijl de accu vol raakt. Een vlakke, hoge curve betekent korte stops."
    long:
      en: >-
        No car charges at its peak speed all the way. Power usually drops as the battery fills, and
        the shape of that drop matters more than the peak. A car that holds 100 kW from 10 % to 70 %
        can beat one that peaks at 200 kW for a few minutes.
    nerd_note:
      en: "Curves depend on battery temperature and software version; we show the source and date of each curve."
    related: [peak-kw, 10-80, dc-km-20min, preconditioning]

  - id: peak-kw
    label: {en: "Top charging speed", nl: "Maximale laadsnelheid"}
    technical: {en: "Peak DC power (kW)"}
    short:
      en: "The highest fast-charging power the car reaches, usually only briefly and under ideal conditions."
      nl: "Het hoogste snellaadvermogen dat de auto haalt, meestal maar kort en onder ideale omstandigheden."
    long:
      en: >-
        Makers like to advertise peak charging power. It is reached only for a short time, with a
        warm battery at a low charge level. Look at the 10-80 % time or range added in 20 minutes
        for a fairer picture.
    nerd_note:
      en: "Peak figures are often the maker's claim; measured peaks can differ by software version and charger."
    related: [charge-curve, 10-80, claim]

  - id: 10-80
    label: {en: "10-80 % charging time", nl: "Laadtijd 10-80 %"}
    technical: {en: "DC 10-80 % time (min)"}
    short:
      en: "Minutes to fast charge from 10 % to 80 %. The usual way to compare charging speed."
      nl: "Minuten om snel te laden van 10 % naar 80 %. De gebruikelijke manier om laadsnelheid te vergelijken."
    long:
      en: >-
        Charging is fastest in the middle of the battery, so the industry compares cars on the time
        from 10 % to 80 %. Remember that a bigger battery adds more kilometres in that time, so
        compare it together with range added in 20 minutes.
    nerd_note:
      en: "Assumes a charger stronger than the car's peak and a battery at optimal temperature."
    related: [charge-curve, peak-kw, dc-km-20min]

  - id: voltage-class
    label: {en: "Battery voltage", nl: "Accuspanning"}
    technical: {en: "Voltage class (400 V / 800 V / 900 V+)"}
    short:
      en: "Whether the car uses a 400 V or 800 V battery. It affects charging speed, especially on older chargers."
      nl: "Of de auto een 400V- of 800V-accu heeft. Dat beïnvloedt de laadsnelheid, vooral op oudere laders."
    long:
      en: >-
        Most electric cars run at around 400 volts; a growing number use around 800 volts. Higher
        voltage allows faster charging on modern chargers, but on older 400 V chargers an 800 V car
        may be slower. We group cars into classes by the battery's nominal voltage.
    nerd_note:
      en: "Class is derived from nominal pack voltage: 400v 300-550 V, 800v 550-850 V, 900v-plus 850-1100 V. Some small '800 V' packs sit near 520 V nominal."
    related: [400v, 800v, 900v-plus, 400v-charger-behaviour, booster]

  - id: 400v-charger-behaviour
    label: {en: "On older chargers", nl: "Op oudere laders"}
    technical: {en: "400 V charger behaviour"}
    short:
      en: "How fast an 800 V car charges on older 400 V chargers: full speed, via a booster, or limited."
      nl: "Hoe snel een 800V-auto laadt op oudere 400V-laders: volle snelheid, via een booster of beperkt."
    long:
      en: >-
        Many fast chargers, especially older ones, can only deliver up to about 500 volts. A 400 V
        car charges on them normally. An 800 V car needs to convert the voltage up with a booster,
        or it charges at reduced power; on some cars this is much slower than the advertised peak.
    nerd_note:
      en: "Values: native, booster (with kW), limited (with kW), not-disclosed. Figures change with software updates."
    related: [voltage-class, booster, dc-charging, 800v]

  - id: booster
    label: {en: "Voltage booster", nl: "Spanningsbooster"}
    technical: {en: "DC-DC boost converter"}
    short:
      en: "A converter that lets an 800 V car charge on a 400 V charger, often at reduced power."
      nl: "Een omvormer waarmee een 800V-auto aan een 400V-lader kan laden, vaak met minder vermogen."
    long:
      en: >-
        An 800 V car cannot take power directly from a charger that only goes up to about 500 volts.
        Some cars add a separate boost converter; others reuse the electric motor and its inverter
        to step up the voltage. The booster's own power limit sets the charging speed on those
        chargers.
    nerd_note:
      en: "Hyundai/Kia E-GMP cars reuse the rear motor and inverter as the booster; reported 400 V charging power varies with software."
    related: [400v-charger-behaviour, voltage-class, 800v]

  - id: chemistry
    label: {en: "Battery type", nl: "Accusoort"}
    technical: {en: "Cell chemistry"}
    short:
      en: "The materials inside the battery cells. It affects range, cost, cold weather and how full to charge daily."
      nl: "De materialen in de accucellen. Bepaalt bereik, prijs, gedrag in de kou en hoe vol je dagelijks laadt."
    long:
      en: >-
        Most electric cars use a nickel-based chemistry (NMC or NCA) or iron phosphate (LFP). Nickel
        types hold more energy but prefer not to sit at 100 %; LFP holds less but is usually happy
        being charged full every day. Newer chemistries such as sodium-ion are only starting to
        appear.
    nerd_note:
      en: "Makers often do not publish the chemistry; we show not-disclosed rather than guess."
    related: [nmc, nca, lfp, lmfp, lmo-nmc, sodium-ion, semi-solid, all-solid-state, lmr, soh]

  - id: cooling
    label: {en: "Battery cooling", nl: "Accukoeling"}
    technical: {en: "Battery thermal management"}
    short:
      en: "How the car keeps its battery at a good temperature. Matters for fast charging and battery life."
      nl: "Hoe de auto de accu op een goede temperatuur houdt. Belangrijk voor snelladen en levensduur."
    long:
      en: >-
        Batteries charge and age best within a comfortable temperature range. Liquid cooling is the
        most effective and most common; air cooling and no active cooling are cheaper but can slow
        fast charging on long trips. Good thermal management also helps with winter charging.
    nerd_note:
      en: "Types: liquid, refrigerant, air, passive. Heating matters as much as cooling in cold climates."
    related: [liquid, refrigerant, air, passive, preconditioning]

  - id: cell-to-pack
    label: {en: "Cells straight in the pack", nl: "Cellen direct in het pakket"}
    technical: {en: "Cell-to-pack (CTP)"}
    short:
      en: "Cells are fitted directly into the battery pack without separate modules, saving weight and space."
      nl: "De cellen zitten direct in het accupakket, zonder losse modules. Dat bespaart gewicht en ruimte."
    long:
      en: >-
        Traditional packs group cells into modules, then modules into a pack. Cell-to-pack skips the
        module step, so more of the pack is active battery material. It can make repairs harder,
        because a fault may not be fixable by swapping one module.
    nerd_note:
      en: "BYD Blade and several CATL packs are cell-to-pack. Repairability depends on the specific design."
    related: [cell-format, chemistry]

  - id: cell-format
    label: {en: "Cell shape", nl: "Celvorm"}
    technical: {en: "Cell format (pouch / prismatic / cylindrical / blade)"}
    short:
      en: "The physical shape of the battery cells: flat pouches, hard boxes, round cylinders or long blades."
      nl: "De vorm van de accucellen: platte zakjes, harde blokjes, ronde cilinders of lange 'blades'."
    long:
      en: >-
        Battery cells come in a few shapes. Pouch cells are flat and light, prismatic cells are hard
        rectangular cans, cylindrical cells look like oversized AA batteries, and blade cells are
        long, thin prismatic cells. For owners the shape matters less than chemistry and cooling.
    nerd_note:
      en: "Cylindrical sizes: 18650, 2170 (21700), 4680. Blade is BYD's long prismatic LFP format."
    related: [cell-to-pack, chemistry]

  - id: usable-vs-gross
    label: {en: "Usable vs total battery", nl: "Bruikbare vs totale accu"}
    technical: {en: "Usable (net) vs gross capacity (kWh)"}
    short:
      en: "Usable capacity is what you can actually drive on. Total (gross) includes a hidden reserve."
      nl: "Bruikbare capaciteit is wat je echt kunt gebruiken. Totaal (bruto) bevat een verborgen reserve."
    long:
      en: >-
        Makers keep part of the battery in reserve to protect it, so the usable capacity is smaller
        than the total. Brochures quote either figure, which makes comparisons confusing. We use
        usable capacity for range calculations and show which one a source quoted.
    nerd_note:
      en: "Buffers are typically a few percent up to about 10 %; some makers changed buffers by software update."
    related: [real-range, soh]

  - id: heat-pump
    label: {en: "Heat pump", nl: "Warmtepomp"}
    technical: {en: "Heat pump (cabin heating)"}
    short:
      en: "An efficient heater that uses less battery in winter than a simple electric heater, saving range."
      nl: "Een zuinige verwarming die in de winter minder stroom kost dan een gewone elektrische kachel."
    long:
      en: >-
        Heating the cabin with a plain resistive heater can use a lot of energy in cold weather. A
        heat pump moves heat instead of making it, using noticeably less electricity. On many used
        cars it was an option, so check whether the car you look at has one.
    nerd_note:
      en: "Gains are largest around 0-10 °C; in deep frost heat pumps lose efficiency and may fall back on resistive heating."
    related: [consumption, preconditioning, real-range]

  - id: preconditioning
    label: {en: "Warming up the battery", nl: "Accu voorverwarmen"}
    technical: {en: "Battery preconditioning"}
    short:
      en: "The car heats or cools the battery before fast charging so it charges at full speed."
      nl: "De auto verwarmt of koelt de accu vóór het snelladen, zodat hij op volle snelheid laadt."
    long:
      en: >-
        A cold battery charges slowly. Many cars warm the battery automatically when you navigate to
        a fast charger, or let you start it manually. Without it, winter fast charging can take much
        longer than the brochure suggests.
    nerd_note:
      en: "Some older cars added preconditioning only via later software updates; others never got it."
    related: [cooling, charge-curve, dc-charging, heat-pump]

  - id: soh
    label: {en: "Battery health", nl: "Accugezondheid"}
    technical: {en: "State of health (SoH, %)"}
    short:
      en: "How much capacity the battery still has compared with new. Key when buying a used electric car."
      nl: "Hoeveel capaciteit de accu nog heeft ten opzichte van nieuw. Belangrijk bij een tweedehands EV."
    long:
      en: >-
        All batteries slowly lose capacity with age and use. State of health compares today's
        capacity with the original, so 90 % means about 10 % less range than new. Ask for a recent
        battery report; many batteries also have a warranty that guarantees a minimum SoH.
    nerd_note:
      en: "SoH is measured differently per maker and tool; treat small differences between reports with care."
    related: [chemistry, usable-vs-gross, lmo-nmc]

  - id: generation
    label: {en: "Generation", nl: "Generatie"}
    technical: {en: "Model generation"}
    short:
      en: "A version of a model that stayed broadly the same over several years, until a major redesign."
      nl: "Een versie van een model die jarenlang grotendeels gelijk bleef, tot een grote vernieuwing."
    long:
      en: >-
        We group each model into generations: periods with the same basic design. Facelifts and
        battery updates inside a generation are shown as change markers. This makes it easier to
        compare used cars from different years.
    nerd_note:
      en: "Hierarchy: make, model, generation, variant. Generation year spans are model years on sale in Europe."
    related: [variant, era, platform]

  - id: variant
    label: {en: "Version", nl: "Uitvoering"}
    technical: {en: "Variant"}
    short:
      en: "A specific battery and motor combination within a generation, such as the long-range version."
      nl: "Een specifieke combinatie van accu en motor binnen een generatie, zoals de long range-versie."
    long:
      en: >-
        Within one generation, cars come with different batteries, motors and drivetrains. Each of
        those is a variant, and specs like range and charging speed belong to the variant. Trim
        levels that only change equipment are not separate variants.
    nerd_note:
      en: "A variant points to one platform and one battery pack and inherits the pack's facts unless it has its own."
    related: [generation, battery-pack, platform]

  - id: platform
    label: {en: "Platform", nl: "Platform"}
    technical: {en: "Vehicle platform / architecture"}
    short:
      en: "The shared technical base under several models, such as Volkswagen's MEB or Hyundai's E-GMP."
      nl: "De gedeelde technische basis onder meerdere modellen, zoals MEB van Volkswagen of E-GMP van Hyundai."
    long:
      en: >-
        Carmakers build several models on one shared base of battery, motors and electronics.
        Cars on the same platform often charge and age in similar ways. Some older electric cars
        were built on platforms designed for petrol cars.
    nerd_note:
      en: "Platform names are partly marketing; we record the owner group and nominal voltage where known."
    related: [variant, battery-pack, voltage-class]

  - id: battery-pack
    label: {en: "Battery pack", nl: "Accupakket"}
    technical: {en: "Battery pack"}
    short:
      en: "The complete battery in the car. Several versions or models often share the same pack."
      nl: "De complete accu in de auto. Meerdere uitvoeringen of modellen delen vaak hetzelfde pakket."
    long:
      en: >-
        A battery pack is the full assembly of cells, cooling, electronics and casing. We store pack
        facts once, such as capacity, chemistry and supplier, and every variant using that pack
        inherits them. If a variant has its own measured figure, that one wins.
    nerd_note:
      en: "Pack facts in the seed data are hand-entered with low confidence until sourced."
    related: [chemistry, cooling, usable-vs-gross, cell-format]

  - id: rapidgate
    label: {en: "Slow repeat fast charging", nl: "Trager snelladen na herhaling"}
    technical: {en: "Rapidgate (thermal throttling)"}
    short:
      en: "When a hot battery makes the car charge slower after one or two fast charges on a trip."
      nl: "Als een warme accu de auto trager laat laden na een of twee snellaadbeurten onderweg."
    long:
      en: >-
        Without active cooling, a battery heats up during fast charging and stays warm. The car then
        reduces charging power to protect it, so the second or third stop on a long trip takes much
        longer. The name comes from early Nissan Leaf owners.
    nerd_note:
      en: "Most common on cars with passive or air cooling; liquid-cooled packs can still throttle in extreme heat."
    related: [passive, air, cooling, dc-charging]

  - id: quality-tier
    label: {en: "Data quality", nl: "Datakwaliteit"}
    technical: {en: "Quality tier"}
    short:
      en: "How well checked a figure is: hand-checked by us, confirmed by several sources, or from one source."
      nl: "Hoe goed een gegeven is gecontroleerd: door ons, door meerdere bronnen bevestigd of uit één bron."
    long:
      en: >-
        Every number on this site has a quality tier. Checked means a person compared it with a
        primary source. Sourced means at least two independent sources agree. Single-source means we
        have only one source so far.
    nerd_note:
      en: "Tiers: checked, sourced, single-source. Independent of confidence, which describes the source itself."
    related: [sources-agree, confidence, claim]

  - id: sources-agree
    label: {en: "Sources agree", nl: "Bronnen eens"}
    technical: {en: "Source agreement"}
    short:
      en: "Two or more independent sources give the same value, within a small tolerance."
      nl: "Twee of meer onafhankelijke bronnen geven dezelfde waarde, binnen een kleine marge."
    long:
      en: >-
        When different sources report the same figure, we can be more sure it is right. If they
        disagree, we show the spread and the sources, rather than silently picking one.
    nerd_note:
      en: "Tolerance depends on the field, for example a few percent for capacity or range."
    related: [quality-tier, confidence]

  - id: confidence
    label: {en: "How sure we are", nl: "Hoe zeker we zijn"}
    technical: {en: "Confidence (high / medium / low)"}
    short:
      en: "Our judgement of how reliable a value is, based on its source and how it was obtained."
      nl: "Ons oordeel over hoe betrouwbaar een waarde is, op basis van de bron en hoe hij is verkregen."
    long:
      en: >-
        Each fact carries a confidence level. High usually means an official or measured value from
        a reliable source; low means hand-entered or estimated. Low-confidence values are shown but
        marked, and are replaced as better sources come in.
    nerd_note:
      en: "Values: high, medium, low. Nerd mode shows source, retrieval date and confidence for every fact."
    related: [quality-tier, estimate, sources-agree]

  - id: estimate
    label: {en: "Estimate", nl: "Schatting"}
    technical: {en: "Estimated value"}
    short:
      en: "A value we calculated from related data, not measured directly on this exact car."
      nl: "Een waarde die we berekenden uit verwante gegevens, niet direct gemeten aan precies deze auto."
    long:
      en: >-
        Where no direct measurement exists, we estimate, for example from a sibling variant or a
        similar car. Estimates are always labelled and show the method used. They are replaced as
        soon as a measured value is available.
    nerd_note:
      en: "For real-world range, the method is the real-range rung."
    related: [real-range-rung, confidence, claim]

  - id: claim
    label: {en: "Maker's claim", nl: "Claim van de fabrikant"}
    technical: {en: "Manufacturer claim"}
    short:
      en: "A figure published by the carmaker, not checked by independent tests."
      nl: "Een getal van de fabrikant zelf, niet gecontroleerd door onafhankelijke tests."
    long:
      en: >-
        Makers publish figures such as peak charging power or 10-80 % time. These are useful but
        often measured in ideal conditions. Where we have independent tests, we show them next to
        the claim.
    nerd_note:
      en: "Official homologation values (like WLTP) are regulated tests and treated separately from marketing claims."
    related: [estimate, peak-kw, wltp, quality-tier]

  - id: era
    label: {en: "Era", nl: "Periode"}
    technical: {en: "Model-year era"}
    short:
      en: "A group of model years with similar technology, used to compare cars of similar age."
      nl: "Een groep modeljaren met vergelijkbare techniek, om auto's van gelijke leeftijd te vergelijken."
    long:
      en: >-
        Electric car technology moved quickly, so a 2016 car and a 2024 car are hard to compare
        directly. We group cars into eras by model year. Within an era, range, charging and prices
        are more comparable.
    nerd_note:
      en: "Eras: pre-2018, 2018-20, 2021-22, 2023-24, 2025+. Pre-2018 cars mostly have only NEDC figures."
    related: [generation, wltp]

  - id: not-disclosed
    label: {en: "Not disclosed", nl: "Niet bekendgemaakt"}
    technical: {en: "not-disclosed"}
    short:
      en: "The maker has not published this, and we have no reliable source yet. We do not guess."
      nl: "De fabrikant heeft dit niet gepubliceerd en we hebben nog geen betrouwbare bron. We gokken niet."
    long:
      en: >-
        Some technical details, such as cell supplier or exact voltage, are not published for many
        cars. Rather than fill the gap with a guess, we show that the value is not disclosed. If you
        have a reliable source, it can be added.
    nerd_note:
      en: "'not-disclosed' is a valid value for every pack, platform and voltage field (Decision 010)."
    related: [confidence, estimate]

  - id: nominal-voltage
    label: {en: "Battery voltage (nominal)", nl: "Nominale accuspanning"}
    technical: {en: "Nominal pack voltage (V)"}
    short:
      en: "The battery's typical working voltage. It changes slightly with charge level; the maximum is higher."
      nl: "De gebruikelijke werkspanning van de accu. Die varieert met de laadstand; het maximum ligt hoger."
    long:
      en: >-
        A battery's voltage rises as it charges and falls as it empties. The nominal voltage is the
        typical middle value; the maximum is reached when full. We use the nominal value to place a
        car in a voltage class.
    nerd_note:
      en: "Nominal is roughly cells in series times about 3.6-3.7 V for NMC, about 3.2 V for LFP."
    related: [voltage-class, 400v, 800v]
