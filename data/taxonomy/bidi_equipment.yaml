# Approved bidirectional boxes (Decision 011, T-019 coordinator half). Rows = schema
# $defs/BidiEquipment. New boxes are new rows.
#
# CONFIDENCE: LOW for every row. Written from research/R-01 (§3, §4, §6) only, without opening
# the maker pages. The schema row has no confidence field, so it is stated here and in `notes`.
# - max_kw and price_band are filled only where R-01 states them for the box itself; otherwise
#   "not-disclosed". Prices in other currencies are not converted (no rate in the sources): they
#   stay in `notes` and price_band is "not-disclosed".
# - markets are filled only where R-01 names them for that box; otherwise left out.
# - source_ids point to data/taxonomy/taxonomy_sources.yaml. None of them is releasable in
#   data/sources.yaml yet (maker documents are blocked, Q-008), so the pipeline holds this whole
#   table back from releases until they are (pipeline/ev_pipeline/release/taxonomy.py).
# - retrieved_at = the R-01 research date, not a fresh check.
# Validate: python3 -I data/taxonomy/validate_taxonomy.py
