# Typical finance terms per country and product for the price-mode calculator (Decision 017, T-043).
# Rows = schema $defs/FinanceProfile. typical_apr is in percent (8.91 = 8.91 %).
#
# Rules (ADDENDUM-5 "Rules for tonight"):
# - typical_apr comes ONLY from a central-bank statistic we could read on retrieved_at. No source = null,
#   and the calculator asks the user for a rate instead of guessing.
# - default_term_months / default_deposit_pct are null unless a source states them. The calculator then
#   uses its own labelled default (spec §8: 48-month term) and says so in its assumptions.
# - review: true = entered by an agent and not yet checked by a person.
# - A national consumer-credit average is NOT a car-loan offer: it covers all consumer loans except
#   revolving credit, overdrafts and credit cards. The calculator labels every result "estimate, not an offer".
# - UK: no finance or lease links until the FCA credit-broking question is answered (Decision 017).
#   The row below only feeds the calculator.
# Validate: python3 -I data/taxonomy/validate_taxonomy.py
finance_profiles:
  - id: nl-used-car-loan
    country: NL
    product: used-car-loan
    typical_apr: null
    default_term_months: null
    default_deposit_pct: null
    source: null
    retrieved_at: null
    notes: >-
      No current central-bank series found on 2026-11-15. The ECB MFI interest rate statistics for the
      Netherlands stop for consumer credit: the APRC series MIR.M.NL.B.A2B.A.C.A.2250.EUR.N ends in
      2010-05 and the agreed-rate series MIR.M.NL.B.A2B.K.R.A.2250.EUR.N ends in 2017-07. No DNB table
      with a current consumer-credit rate was found. The calculator asks the user for a rate.
    review: true

  - id: de-used-car-loan
    country: DE
    product: used-car-loan
    typical_apr: 8.91
    default_term_months: null
    default_deposit_pct: null
    source:
      name: ECB Data Portal, MFI interest rate statistics (MIR), compiled by Deutsche Bundesbank
      url: https://data.ecb.europa.eu/data/datasets/MIR/MIR.M.DE.B.A2B.A.C.A.2250.EUR.N
      licence: ESCB statistics reuse policy, free reuse with source acknowledged (to confirm)
      series_id: MIR.M.DE.B.A2B.A.C.A.2250.EUR.N
      series_title: >-
        Germany, Annual percentage rate of charge (APRC), loans to households for consumption
        excluding revolving loans and overdrafts, convenience and extended credit card debt, total
        initial rate fixation, new business, EUR
      period: "2026-09"
    retrieved_at: "2026-11-15"
    notes: >-
      All consumer loans, not car loans only, and not split into new and used cars. 2026-09 is marked
      provisional (OBS_STATUS P) by the ECB; 2026-08 was 8.99 and 2026-07 8.53. No sourced term or deposit.
    review: true

