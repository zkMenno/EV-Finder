# Successors for variant ids that left the catalogue (T-062, Decision 033; read by
# pipeline/ev_pipeline/release/retired.py). An id without an entry here maps to null (410 page).
# Validate: covered by pipeline/tests/test_shared_year_source_names.py.
schema: retired-ids/v1
ids:
  # Release 1 rows made from OpenEV "AWD" / "Base" MY2023-25 records. T-068 split the Ioniq 5
  # (gen1 to 2024, facelift from 2024) and T-110 pinned OpenEV MY2023-24 "AWD" / "Base" to the
  # gen1 77.4 kWh seed rows, which now carry those records (PR #91 review).
  hyundai-ioniq-5-gen1-awd: hyundai-ioniq-5-gen1-77kwh-awd
  hyundai-ioniq-5-gen1-base: hyundai-ioniq-5-gen1-77kwh-rwd
  # The Ioniq 5 N launched in 2024 on the 84 kWh pack: it now sits on the facelift generation.
  hyundai-ioniq-5-gen1-n: hyundai-ioniq-5-facelift-n
  # T-148: OpenEV's ID.7 "PRO" and "Tour" rows carried the Pro S figures (86 kWh, 700 km); their
  # records now join the seed Pro S row (source_names), so the two OpenEV-made ids leave.
  volkswagen-id7-gen1-pro: volkswagen-id7-gen1-pro-s
  volkswagen-id7-gen1-tour: volkswagen-id7-gen1-pro-s
  # T-151: OpenEV's Leaf "62 kWh" (110 kW) is the 160 kW e+ (Nissan sells the 62 kWh battery only
  # with the e+ motor); its records join the seed e+ row.
  nissan-leaf-ze1-62-kwh: nissan-leaf-ze1-e-plus-62kwh
  # T-151: the ë-SpaceTourer is split per battery; the OpenEV "Base" records (46 kWh net) are the
  # 50 kWh car.
  citroen-e-spacetourer-gen1-base: citroen-e-spacetourer-gen1-50kwh
  # T-154: the Abarth 500e row moved from the Fiat 500e (332) generation to the Abarth model, where
  # EEA, RDW and KilowattApp file the car.
  fiat-500e-332-abarth: abarth-500e-gen1-base
