# Hand-curated seed list of used-EV favourites and their generations.
# Written from model knowledge only (no sources fetched). Every `uncertain: true`
# entry must be hand-checked against a primary source before it is published.
# Years = model years on sale in Europe (end null = still on sale) unless a note says otherwise.
# Validate: python3 -I data/seed/validate_seed.py data/seed/models.yaml
schema: seed-models/v1
makes:
  - id: tesla
    name: Tesla
    models:
      - id: tesla-model-3
        name: Model 3
        segment: D
        body: sedan
        generations:
          - id: tesla-model-3-gen1
            name: Model 3 (2019-2023)
            years: [2019, 2023]
            uncertain: false
            change_markers:
              - {year: 2019, text: "European deliveries start (Fremont-built)"}
              - {year: 2021, text: "Refresh: heat pump, chrome delete, powered boot; Shanghai-built supply for Europe"}
              - {year: 2021, text: "Standard Range Plus moves to LFP battery (late 2021)"}
              - {year: 2022, text: "Trim names change to RWD / Long Range / Performance"}
          - id: tesla-model-3-highland
            name: Highland
            years: [2024, null]
            uncertain: true
            notes: "First European Highland deliveries were late 2023 (sold as MY2024); start year could be argued as 2023. The 2025 Standard trim and its European timing are not verified."
            change_markers:
              - {year: 2024, text: "Highland facelift: new front/rear, ventilated seats, rear screen, no stalks"}
              - {year: 2024, text: "Highland Performance variant"}
              - {year: 2025, text: "Lower-cost Standard trim announced (European availability unverified)"}

      - id: tesla-model-y
        name: Model Y
        segment: J-medium
        body: suv
        generations:
          - id: tesla-model-y-gen1
            name: Model Y (2021-2024)
            years: [2021, 2024]
            uncertain: false
            change_markers:
              - {year: 2021, text: "European deliveries start (Shanghai-built)"}
              - {year: 2022, text: "Giga Berlin production starts"}
              - {year: 2022, text: "RWD (LFP) entry version added in Europe"}
          - id: tesla-model-y-juniper
            name: Juniper
            years: [2025, null]
            uncertain: true
            notes: "European Juniper deliveries began around March 2025; exact timing of Performance and lower-cost Standard variants in Europe not verified."
            change_markers:
              - {year: 2025, text: "Juniper facelift: light bars, new interior, rear screen"}
              - {year: 2025, text: "Juniper Performance and Standard variants (timing per market unverified)"}

      - id: tesla-model-s
        name: Model S
        segment: F
        body: sedan
        generations:
          - id: tesla-model-s-gen1
            name: Pre-facelift (2013-2016)
            years: [2013, 2016]
            uncertain: true
            notes: "Kept simple per brief. European deliveries started around mid-2013 (US 2012). Many battery sizes (40/60/70/85/90 kWh) in this span."
            change_markers:
              - {year: 2014, text: "Dual-motor 'D' variants and Autopilot hardware 1"}
              - {year: 2015, text: "70 and 90 kWh batteries"}
          - id: tesla-model-s-facelift
            name: Facelift (2016-2021)
            years: [2016, 2021]
            uncertain: true
            notes: "Nose facelift April 2016. The 2019 'Raven' drivetrain/suspension update is sometimes treated as its own sub-generation; kept as a change marker."
            change_markers:
              - {year: 2016, text: "New front end, HEPA filter, Autopilot hardware 2 (late 2016)"}
              - {year: 2017, text: "100 kWh battery; 60/75 kWh entry versions"}
              - {year: 2019, text: "'Raven' update: permanent-magnet front motor, adaptive air suspension"}
          - id: tesla-model-s-palladium
            name: Palladium refresh
            years: [2022, 2026]
            uncertain: true
            notes: "Palladium refresh launched 2021 in the US but European deliveries only began around late 2022 (gap in European supply in 2021-22). Tesla announced in early 2026 that Model S production would end; end year 2026 needs checking."
            change_markers:
              - {year: 2022, text: "Yoke steering, landscape screen, Plaid tri-motor"}
              - {year: 2023, text: "Round steering wheel option"}
              - {year: 2025, text: "Minor refresh (new wheels, lighting, suspension tweaks)"}

  - id: renault
    name: Renault
    models:
      - id: renault-zoe
        name: Zoe
        segment: B
        body: hatchback
        name_aliases: [ZOE, Zoé, Zoe E-Tech]
        generations:
          - id: renault-zoe-ph1
            name: Phase 1 (22/41 kWh)
            years: [2013, 2019]
            uncertain: false
            notes: "Many used cars still have a battery rental contract (battery lease); check whether the battery is owned."
            change_markers:
              - {year: 2013, text: "22 kWh, Q210 motor (43 kW AC charging)"}
              - {year: 2015, text: "R240 motor (longer range, 22 kW AC max)"}
              - {year: 2016, text: "Z.E. 40 battery (41 kWh)"}
              - {year: 2018, text: "R110 motor"}
          - id: renault-zoe-ph2
            name: Phase 2 (ZE50)
            years: [2019, 2024]
            uncertain: true
            notes: "Launched late 2019, most deliveries from 2020. Production reported to have ended early 2024; confirm last model year. End year kept at 2024. Registration evidence, checked 2026-11-15 (RDW m9d7-ebf2 fleet fetched 2026-11-14, by year of first admission; EEA 2025 provisional new registrations; KBA FZ10). First-admission year is not model year (early deliveries, late stock, imports). 2025: RDW 2 cars (under 0.1% of the 7861 NL cars of 2020-2024), EEA 39 (DE 6, FR 17, BE 14, NL 2), KBA 7; likely late stock."
            change_markers:
              - {year: 2019, text: "52 kWh battery, new interior, optional 50 kW CCS"}
              - {year: 2021, text: "Renamed Zoe E-Tech Electric"}

      - id: renault-megane-e-tech
        name: Megane E-Tech Electric
        segment: C
        body: crossover
        name_aliases: [Megane E-Tech, Mégane E-Tech, Megane E-Tech Electric, Megane EV]
        bev_only_aliases: [MEGANE]
        source_aliases: {dft-veh: [MEGANE]}
        # Q-021 scoped aliases (used when EV_SCOPED_ALIASES is on): per source, a bare name
        # matches the whole name only; {match: prefix} matches leading words. Replaces
        # bev_only_aliases + source_aliases for this model (those stay for the flag-off path).
        aliases_by_source:
          rdw,rdw-tgk,eea,kba-fz10,ademe,kilowatt-openev: ["MEGANE"]
          dft-veh: [{name: "MEGANE", match: prefix}]
        generations:
          - id: renault-megane-e-tech-gen1
            name: Megane E-Tech Electric
            years: [2022, null]
            uncertain: true
            notes: "Whether it is still on sale in all European markets (and any facelift timing) is unverified."
            change_markers:
              - {year: 2022, text: "Launch: EV40 (40 kWh) and EV60 (60 kWh)"}

      # T-051 part 2: see the rule comment above volvo-ex30 (segment order: QUESTIONS Q-083).
      - id: renault-5-e-tech
        name: 5 E-Tech
        segment: B
        body: hatchback
        notes: "Body: OpenEV `hatchback`. Segment: nearest seed hatchback by OpenEV length (5 E-Tech 3920 mm) is the Mini Cooper SE (3850 mm, B); Wikidata Q105095659 subclass of (P279) supermini (B) agrees. DfT names it '5 TECHNO E-TECH EV' etc. (prefix '5', DfT only); KBA series 'R5'."
        source_aliases:
          kba-fz10:
            - {name: R5, note: "KBA Modellreihe R5 (BEV column)"}
          dft-veh: ["5"]
        aliases_by_source:
          kba-fz10:
            - {name: "R5", match: prefix, note: "KBA Modellreihe R5 (BEV column)"}
          dft-veh: [{name: "5", match: prefix}]
        generations:
          - id: renault-5-e-tech-gen1
            name: 5 E-Tech
            years: [2024, null]
            uncertain: true
            notes: "One generation. Registration evidence, checked 2026-11-15 (RDW m9d7-ebf2 fleet fetched 2026-11-14, by year of first admission; EEA 2025 provisional new registrations; KBA FZ10; DfT VEH0120 2026 Q2). First-admission year is not model year. RDW 'RENAULT 5 E-TECH ELECTRIC': 2024 387, 2025 5127, 2026 4092 (9606 NL cars). 2024 is 4.0% (below the 5% bar) but OpenEV starts at model year 2024, so the start is 2024. Wikidata Q105095659 has no year. Still registered: EEA 2025 BE 1804, DE 7882, FR 40836, NL 4993; KBA R5 2024 942, 2025 7884, 2026 Jan-Oct 8202; DfT '5 ... E-TECH EV' 15966 (no year)."

      - id: renault-scenic-e-tech
        name: Scenic E-Tech
        segment: J-medium
        body: crossover
        notes: "The electric Scenic (2024-); earlier Scenics are combustion cars and do not appear in these BEV-only sources. Body: OpenEV `crossover` (Wikidata Q122167780: electric car). Segment: nearest seed model by OpenEV length (Scenic E-Tech 4490 mm) is the BMW iX1 (4500 mm, J-medium); judgement call, Q-083. DfT names it 'SCENIC TECHNO E-TECH EV' etc. (prefix 'SCENIC', DfT only); KBA series 'SCENIC' (BEV column)."
        source_aliases:
          kba-fz10:
            - {name: SCENIC, note: "KBA Modellreihe SCENIC, BEV column only: counted as the Scenic E-Tech"}
          dft-veh: [SCENIC]
        aliases_by_source:
          kba-fz10:
            - {name: "SCENIC", match: prefix, note: "KBA Modellreihe SCENIC, BEV column only: counted as the Scenic E-Tech"}
          dft-veh: [{name: "SCENIC", match: prefix}]
        generations:
          - id: renault-scenic-e-tech-gen1
            name: Scenic E-Tech
            years: [2024, null]
            uncertain: true
            notes: "One generation. Registration evidence, checked 2026-11-15 (RDW m9d7-ebf2 fleet fetched 2026-11-14, by year of first admission; EEA 2025 provisional new registrations; KBA FZ10; DfT VEH0120 2026 Q2). First-admission year is not model year. RDW 'SCENIC E-TECH ELECTRIC': 2024 2367, 2025 3117, 2026 1563 (7047 NL cars); 2024 is 33.6%, above the 5% bar. RDW has no car in 2023, so the start stays 2024, although KilowattApp has model year 2023 records and EEA FR has 31 cars of 2023 (unverified). OpenEV starts at model year 2024. Wikidata Q122167780 has no year. Still registered: EEA 2025 BE 2165, DE 1917, FR 16287, NL 3042; KBA SCENIC BEV 2024 1665, 2025 1919, 2026 Jan-Oct 2732; DfT 'SCENIC ... E-TECH EV' 13679 (no year). T-068 year check: Menno's sheet says 2023 (reveal year); kept 2024 because no NL car was registered in 2023. The importer maps his 2023 row to this generation as `generation_match: nearest`."

      # T-068: see the rule comment above xpeng (end of file).
      - id: renault-4-e-tech
        name: 4 E-Tech
        segment: J-small
        body: crossover
        name_aliases: [4 E-Tech Electric, Renault 4 E-Tech, R4 E-Tech]
        notes: "The electric Renault 4 (2025-); the old Renault 4 (1961-1994) is a combustion car and never appears in BEV-only rows. Body: OpenEV `crossover` (4 E-Tech, 4160 mm). Segment by length, J-small; judgement call."
        generations:
          - id: renault-4-e-tech-gen1
            name: 4 E-Tech
            years: [2025, null]
            uncertain: true
            notes: "One generation. RDW m9d7-ebf2 queried 2026-11-15, by year of first admission: 'RENAULT 4 E-TECH ELECTRIC' 2025 780, 2026 1731 (164 without a date yet). OpenEV starts at model year 2025."

  - id: nissan
    name: Nissan
    models:
      - id: nissan-leaf
        name: Leaf
        segment: C
        body: hatchback
        name_aliases: [LEAF]
        generations:
          - id: nissan-leaf-ze0
            name: ZE0
            years: [2011, 2017]
            uncertain: true
            notes: "European deliveries started 2011 (Japan/US late 2010). Covers both ZE0 (2011-2013) and the 2013 AZE0 update; some sources split these. No active battery cooling."
            change_markers:
              - {year: 2013, text: "Europe-built (Sunderland) AZE0 update, 6.6 kW charger option"}
              - {year: 2016, text: "30 kWh battery"}
          - id: nissan-leaf-ze1
            name: ZE1
            years: [2018, 2025]
            uncertain: true
            notes: "End year uncertain: ZE1 production overlapped with the third-generation launch."
            change_markers:
              - {year: 2018, text: "40 kWh, new body; still CHAdeMO, no active battery cooling"}
              - {year: 2019, text: "e+ 62 kWh variant"}
          - id: nissan-leaf-gen3
            name: 3rd generation (crossover)
            years: [2025, null]
            uncertain: true
            notes: "Added beyond the brief's ZE0/ZE1 so ZE1 has a successor. Revealed mid-2025 as a crossover with CCS; European on-sale year (2025 vs 2026) and chassis code unverified. Body differs from earlier Leafs."
            change_markers: []

      # T-068: see the rule comment above xpeng (end of file).
      - id: nissan-ariya
        name: Ariya
        segment: J-medium
        body: crossover
        name_aliases: [ARIYA, Nissan Ariya]
        notes: "Body: OpenEV `crossover` (Ariya, 4595 mm). Segment by length, J-medium; judgement call."
        generations:
          - id: nissan-ariya-gen1
            name: Ariya
            years: [2022, null]
            uncertain: true
            notes: "One generation (a 2025 facelift is reported but not checked). RDW m9d7-ebf2 queried 2026-11-15, by year of first admission: 'NISSAN ARIYA' 2022 350, 2023 636, 2024 571, 2025 597, 2026 116. OpenEV has model years 2023-2025."

  - id: volkswagen
    name: Volkswagen
    make_aliases_by_source: {eea: ["VOLKSWAGEN, VW"]}  # Q-021 (scoped aliases on): EEA Mk spelling
    models:
      - id: volkswagen-e-golf
        name: e-Golf
        segment: C
        body: hatchback
        name_aliases: [e Golf, eGolf, Golf electric]
        # bev_only_aliases: bare trade names; matched only for BEV-filtered sources (matcher.BEV_FILTERED_SOURCES: rdw, eea, kba-fz10, dft-veh, ademe), whole name only.
        bev_only_aliases: [GOLF]
        # Q-021 scoped aliases (used when EV_SCOPED_ALIASES is on): per source, a bare name
        # matches the whole name only; {match: prefix} matches leading words. Replaces
        # bev_only_aliases + source_aliases for this model (those stay for the flag-off path).
        # rdw-tgk takes the rdw names: its make/model come from the same NL plates (BEV proxy).
        aliases_by_source:
          rdw,rdw-tgk,eea,kba-fz10,ademe,kilowatt-openev: ["GOLF"]
          dft-veh: ["GOLF"]
          rdw,rdw-tgk: ["GOLF E"]
        generations:
          - id: volkswagen-e-golf-mk7
            name: Mk7
            years: [2014, 2017]
            uncertain: false
            change_markers:
              - {year: 2014, text: "24.2 kWh, CCS"}
          - id: volkswagen-e-golf-mk75
            name: Mk7.5
            years: [2017, 2020]
            uncertain: false
            change_markers:
              - {year: 2017, text: "Facelift: 35.8 kWh, 100 kW motor"}
              - {year: 2020, text: "Production ends late 2020"}

      - id: volkswagen-id3
        name: ID.3
        segment: C
        body: hatchback
        name_aliases: [ID3, ID 3]
        # Q-021 scoped aliases (used when EV_SCOPED_ALIASES is on): per source, a bare name
        # matches the whole name only; {match: prefix} matches leading words. Replaces
        # bev_only_aliases + source_aliases for this model (those stay for the flag-off path).
        aliases_by_source:
          rdw,rdw-tgk: ["VOLKSWAGEN, VW ID.3"]
        generations:
          - id: volkswagen-id3-gen1
            name: ID.3
            years: [2020, null]
            uncertain: true
            notes: "The 2023 update is treated as a facelift (change marker). Reports of a later rename (e.g. 'ID.3 Neo') are unverified."
            change_markers:
              - {year: 2020, text: "1st Edition deliveries; early software issues"}
              - {year: 2021, text: "77 kWh Pro S"}
              - {year: 2023, text: "Facelift: new front, upgraded interior materials, software 3.x"}
              - {year: 2024, text: "APP550 motor, Pro S 79 kWh; GTX variant"}

      - id: volkswagen-id4
        name: ID.4
        segment: J-medium
        body: suv
        name_aliases: [ID4, ID 4]
        source_aliases:
          kba-fz10:
            - {name: "ID.4, ID.5", note: "KBA joins ID.4 and ID.5 in one row; the count includes the ID.5 (volkswagen-id5 since T-068; KBA cannot split the two)"}
        # Q-021 scoped aliases (used when EV_SCOPED_ALIASES is on): per source, a bare name
        # matches the whole name only; {match: prefix} matches leading words. Replaces
        # bev_only_aliases + source_aliases for this model (those stay for the flag-off path).
        aliases_by_source:
          kba-fz10:
            - {name: "ID.4, ID.5", match: prefix, note: "KBA joins ID.4 and ID.5 in one row; the count includes the ID.5 (volkswagen-id5 since T-068; KBA cannot split the two)"}
        generations:
          - id: volkswagen-id4-gen1
            name: ID.4
            years: [2020, null]
            uncertain: true
            notes: "1st Edition deliveries late 2020/early 2021. A facelift or rename around 2026 has been reported but is unverified. Start year moved 2021 -> 2020 (coverage-gaps finding 7). Registration evidence, checked 2026-11-15 (RDW m9d7-ebf2 fleet fetched 2026-11-14, by year of first admission; EEA 2025 provisional new registrations; KBA FZ10). First-admission year is not model year (early deliveries, late stock, imports). RDW: 2830 NL cars first admitted in 2020, all 'ID.4 PRO 150 KW' (the same name as 2,225 cars of 2023), = 11.7% of the model's 24125 NL cars, so above the 5% bar."
            change_markers:
              - {year: 2021, text: "GTX dual-motor"}
              - {year: 2023, text: "MY24 update: APP550 motor, new infotainment"}

      # T-051 part 2: see the rule comment above volvo-ex30 (segment order: QUESTIONS Q-083).
      - id: volkswagen-id7
        name: ID.7
        segment: E
        body: sedan
        notes: "Saloon and Tourer (estate) in one model: every source uses the one name 'ID.7' (RDW/EEA 'ID.7 TOURER ...', OpenEV variant 'Tour'). Body: OpenEV `sedan`. Segment: Wikidata Q116044540 subclass of (P279) 'executive car' = E (the nearest-length rule would give F: Porsche Taycan 4963 mm vs ID.7 4961 mm, and the seed has no E model); judgement call, Q-083."
        generations:
          - id: volkswagen-id7-gen1
            name: ID.7
            years: [2023, null]
            uncertain: true
            notes: "One generation: no second type or name in the data. Registration evidence, checked 2026-11-15 (RDW m9d7-ebf2 fleet fetched 2026-11-14, by year of first admission; EEA 2025 provisional new registrations; KBA FZ10; DfT VEH0120 2026 Q2). First-admission year is not model year. RDW 'ID.7 ...': 2023 54, 2024 1259, 2025 3719, 2026 2674 (7706 NL cars). 2023 is 0.7% (below the 5% bar) but Wikidata Q116044540 inception (P571) and commercialization date (P5204) are 2023 and KilowattApp has model year 2023 records, so the start is 2023. Still registered: EEA 2025 BE 4550, DE 34547, FR 899, NL 3613; KBA ID.7 2023 1095, 2024 14554, 2025 34563, 2026 Jan-Oct 26048; DfT 'ID7 ...' 12975 (no year)."
            change_markers:
              - {year: 2024, text: "ID.7 Tourer appears in registrations (RDW: 'ID.7 TOURER PRO' 511 NL cars first admitted 2024, none in 2023)"}

      - id: volkswagen-id-buzz
        name: ID. Buzz
        segment: J-medium
        body: mpv
        notes: "Body: OpenEV `mpv` (Wikidata Q30765198: subclass of minibus). Segment: no seed model has an mpv body, so no nearest-length match in the same family; J-medium as a placeholder (as for the Explorer EV): judgement call, Q-083. RDW also files a few 'ID. BUZZ CARGO ...' (van) names as passenger cars (1 in 2022, 3 in 2023, 19 in 2024 and some later); they match this model by name."
        generations:
          - id: volkswagen-id-buzz-gen1
            name: ID. Buzz
            years: [2022, null]
            uncertain: true
            notes: "One generation: the 'LR' / 'KR' and 'GTX' names from 2024 (KilowattApp 'LWB' / 'NWB') keep the 'ID. BUZZ' name. Registration evidence, checked 2026-11-15 (RDW m9d7-ebf2 fleet fetched 2026-11-14, by year of first admission; EEA 2025 provisional new registrations; KBA FZ10; DfT VEH0120 2026 Q2). First-admission year is not model year. RDW 'ID. BUZZ ...' / 'ID.BUZZ ...' / 'ID BUZZ ...': 2022 177, 2023 652, 2024 297, 2025 667, 2026 530 (2323 NL cars); 2022 is 7.6%, above the 5% bar. Wikidata Q30765198 inception (P571) 2022 agrees; KilowattApp starts at model year 2022. Still registered: EEA 2025 BE 1243, DE 8590, FR 1020, NL 524; KBA ID. BUZZ 2022 1367, 2023 5028, 2024 4769, 2025 8564, 2026 Jan-Oct 9421; DfT 'ID BUZZ ...' 9388 (no year)."
            change_markers:
              - {year: 2024, text: "'LR' / 'KR 210 KW' names appear in RDW (2024: 'PRO KR 210 KW' 19, 'PRO LR 210 KW' 15 NL cars; 'GTX LR 250 KW' 70 in 2025)"}

      # T-068: see the rule comment above xpeng (end of file).
      - id: volkswagen-id5
        name: ID.5
        segment: J-medium
        body: coupe
        name_aliases: [ID5, ID 5]
        notes: "Body: OpenEV `coupe` (ID.5, 4599 mm). Segment: nearest seed model by length is the ID.4 (J-medium); judgement call. KBA reports ID.4 and ID.5 in one row; that row stays on volkswagen-id4 (cannot be split)."
        generations:
          - id: volkswagen-id5-gen1
            name: ID.5
            years: [2022, null]
            uncertain: true
            notes: "One generation. RDW m9d7-ebf2 queried 2026-11-15, passenger cars by year of first admission (not model year): 'ID.5 PRO 150 KW' 2022 748, 2023 396; 'ID.5 PRO 128 KW' 2022 656, 2023 422; 'ID.5 GTX 220 KW' 2022 144, 2023 228; 'ID.5 PRO 210KW' 2024 150, 2025 108, 2026 7; 'ID.5 PURE 125KW' 2025 8. No car before 2022, so the start is 2022. OpenEV has model years 2023-2025. 2026 registrations continue (few)."
            change_markers:
              - {year: 2024, text: "RDW names change to 'PRO 210KW' / 'GTX 250KW' (new motor), as for the ID.4"}

  - id: hyundai
    name: Hyundai
    make_aliases_by_source: {eea: ["HYUNDAI, GENESIS"]}  # EEA Mk group; Genesis models are not in the seed
    models:
      - id: hyundai-ioniq-electric
        name: Ioniq Electric
        segment: C
        body: hatchback
        name_aliases: [IONIQ Electric, Ioniq EV, Ioniq (electric)]
        # bev_only_aliases: bare trade names; matched only for BEV-filtered sources (matcher.BEV_FILTERED_SOURCES: rdw, eea, kba-fz10, dft-veh, ademe), whole name only.
        bev_only_aliases: [IONIQ]
        name_excludes: [Ioniq 3, Ioniq 5, Ioniq 6, Ioniq 9]
        source_aliases: {dft-veh: [IONIQ]}
        # Q-021 scoped aliases (used when EV_SCOPED_ALIASES is on): per source, a bare name
        # matches the whole name only; {match: prefix} matches leading words. Replaces
        # bev_only_aliases + source_aliases for this model (those stay for the flag-off path).
        aliases_by_source:
          rdw,rdw-tgk,eea,kba-fz10,ademe,kilowatt-openev: ["IONIQ"]
          dft-veh: [{name: "IONIQ", match: prefix}]
        generations:
          - id: hyundai-ioniq-electric-gen1
            name: Ioniq Electric
            years: [2016, 2022]
            uncertain: true
            notes: "Not to be confused with Ioniq 5/6. European launch late 2016; facelift deliveries spread over 2019-2020; production ended 2022."
            change_markers:
              - {year: 2016, text: "28 kWh"}
              - {year: 2019, text: "Facelift: 38.3 kWh, 7.2 kW on-board charger"}

      - id: hyundai-kona-electric
        name: Kona Electric
        segment: J-small
        body: suv
        name_aliases: [Kona EV, KONA Electric, Kauai Electric]
        # bev_only_aliases: bare trade names; matched only for BEV-filtered sources (matcher.BEV_FILTERED_SOURCES: rdw, eea, kba-fz10, dft-veh, ademe), whole name only.
