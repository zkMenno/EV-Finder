  - 'KBA series ''MINI'' is not split into Cooper E / Aceman / Countryman: it is listed as mini-unsplit
    and not given to mini-cooper-se.'
  - KBA series names (X1, 5ER, GLB, ...) are read from the BEV column and mapped by PROPOSED_RULES (reviewed
    by hand, not by a source).
  - Mixed-generation names stay at model level (BMW iX3 holds the old G08 and the 2025+ iX3 in DfT and
    KBA; RDW 2018-2024 is G08 only).
