notes:
  tesla-m3-sr-nca: "Fremont-built early SR+; Panasonic 2170 cells. Gross capacity not known to us."
  tesla-m3y-lfp-60: "CATL prismatic LFP for Shanghai-built cars. Some Berlin-built Model Y RWD reportedly used BYD Blade LFP instead: supplier deliberately left out. Also used by Highland / Juniper RWD (about 57.5-60 kWh)."
  tesla-m3y-lr-75: "Chemistry varies: NCA (Panasonic, US-built) or NMC/NCMA (LG Energy Solution, China-built) reported. Capacity drifted between about 75 and 79 kWh over the years; not split yet."
  tesla-s-60: "Some later '60' cars were software-limited 75 kWh packs (seed variant note)."
  tesla-s-palladium: "Usable capacity from the seed variant; gross not known to us."
  renault-zoe-22: "Chemistry often described as an LMO/NMC blend for the first Zoe; not confirmed, so chemistry left out. Air-cooled/heated via the HVAC system."
  renault-zoe-41: "Air cooling via HVAC air, as on the 22 kWh pack (reported)."
  renault-zoe-52: "Air cooling via HVAC air (reported). Gross about 54-55 kWh reported; left out."
  dacia-spring-27: "Widely reported to have no liquid cooling, but the exact thermal setup is not known to us. Pack voltage may be below the 400v class range."
  nissan-leaf-24: "LMO-based cells with a nickel component (AESC). Nominal 360 V reported. Strong heat-related ageing on early (2011-2012) cars."
  nissan-leaf-30: "Chemistry changed from the 24 kWh pack (reported to have more nickel); not classified."
  nissan-leaf-40: "Nominal about 350 V. No active cooling: rapidgate on long trips."
  nissan-leaf-62: "Cell supplier not known to us."
  nissan-leaf3-52: "Third-generation Leaf capacities and liquid cooling are from launch reports; verify against Nissan specs."
  nissan-leaf3-75: "See nissan-leaf3-52."
  vw-e-golf-24: "No liquid cooling (reported air/passive); classified passive. Usable capacity not known to us."
  vw-e-golf-36: "Usable about 32 kWh reported. Classified passive as for the 24 kWh pack; verify."
  meb-45: "Cell supplier and format vary by factory (LG pouch, CATL prismatic, others reported); left out. Early MEB cells reported as NMC712."
  meb-52: "Used by ID.4 Pure and Audi Q4 35. Seed Q4 35 note says 55 gross / 52 usable."
  meb-58: "See meb-45 on suppliers."
  meb-77: "See meb-45 on suppliers. Replaced by meb-79 from about 2024 on several models."
  meb-79: "2024+ update; capacities from launch reports."
  audi-etron-71: "Usable about 64-65 kWh reported; left out."
  audi-etron-95: "Usable rose from about 83.6 to about 86 kWh with a 2020 software change (reported); 86 used."
  audi-q8-etron-95: "Cell format and supplier not known to us."
  audi-q8-etron-114: "Samsung SDI prismatic cells reported; supplier left out."
  hk-ioniq-28: "Cooling type not known to us (reported air or liquid); left out."
  hk-ioniq-38: "Cell supplier not known to us."
  hk-39: "Cells by LG Chem on 2018-2020 Kona (subject to a 2021 recall) and SK Innovation on other cars/years; supplier left out. Nominal 327 V from Hyundai specs as remembered."
  hk-64: "LG Chem (early Kona, recalled 2021) or SK Innovation (Niro, Soul, later Kona); supplier left out. Nominal 356 V from Hyundai specs as remembered."
  kia-soul-27: "Air-cooled pack (reported)."
  kia-soul-30: "Whether this pack was sold in Europe is uncertain (seed variant note)."
  kia-niro-sg2-65: "CATL cells reported; left out."
  hk-kona-sx2-48: "Capacities from launch data; cooling assumed liquid as on predecessors; verify."
  hk-kona-sx2-65: "See hk-kona-sx2-48."
  egmp-53: "Ioniq 6 Standard Range only. Supplier and nominal voltage not known to us."
  egmp-58: "Nominal 522.7 V (Hyundai spec, as remembered): below the 550 V class boundary although sold as 800 V."
  egmp-72-6: "Early Ioniq 5 / EV6 Long Range."
  egmp-77-4: "Ioniq 5 / 6 and EV6 Long Range from about 2022."
  egmp-63: "Facelift replacement for egmp-58; supplier and voltage not verified."
  egmp-84: "Facelift replacement for egmp-77-4; supplier and voltage not verified."
  bmw-i3-60ah: "Direct refrigerant cooling from the AC circuit."
  bmw-gen5-67: "Gen5 cells from CATL and Samsung SDI reported; supplier left out."
