    source_name: "RDW TGK Energiebron Uitvoering (gr7t-qfnb), EU type approval e4*2007/46*1293*46, variant YS5LD, version BHB3S5T3X (Tesla Model Y, CC0)"
    retrieved: 2026-11-17
    quote: '"actieradiusvolledigelekwltpbgr": "568"'
    locator: "Drivetrain row 1, WLTP range upper-consumption bound (20-inch wheels per InsideEVs 2025-02-21)"
    confidence: medium
    claim: true
  - variant_id: tesla-model-y-juniper-long-range-awd
    field: consumption_kwh_100km
    value: 14.8
    unit: kWh/100km
    source_url: https://opendata.rdw.nl/resource/gr7t-qfnb.json?typegoedkeuringsnummer=e4*2007/46*1293*46&codevarianttgk=YS5LD&codeuitvoeringtgk=BHB3S5T3X
    source_name: "RDW TGK Energiebron Uitvoering (gr7t-qfnb), EU type approval e4*2007/46*1293*46, variant YS5LD, version BHB3S5T3X (Tesla Model Y, CC0)"
    retrieved: 2026-11-17
    quote: '"verbruikvolledigelekwltpogr": "148.00"'
    locator: "Drivetrain row 1, WLTP combined consumption lower bound 148 Wh/km (upper bound 153 Wh/km)"
