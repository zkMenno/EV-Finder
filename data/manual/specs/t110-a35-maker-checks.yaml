# T-110 (A-35 B4 + S8), 2026-11-17: maker and type-approval figures for release rows that
# carry an implausible or wrong value. Source `manual` is blocked until Q-008, so none of these
# ship; under Decision 031 each one withholds a lone-source value it contradicts
# (qa/value_guard.guard_contradicted) and agrees with, or anchors, the right one.
# Every value below was read on the page named, on the date given.
#
# Model Y: the wrong 719 km comes from Open EV Data itself. Its files
# src/tesla/model_y/2024/model_y_long_range_awd.json and .../2025/model_y_long_range_awd.json
# (both "accessed_at 2025-12-28", read 2026-11-17) carry {"cycle": "wltp", "range_km": 719}:
# 719 km is the Chinese CLTC figure of the Juniper Long Range AWD, labelled WLTP. Our derived
# consumption (79 kWh / 719 km = 11.0 kWh/100 km) and DC km per 20 min (387) follow from it.
# Tesla's own model pages (tesla.com/*/modely) render their figures client-side and returned
# no numbers to a plain fetch on 2026-11-17, and web.archive.org is not reachable from here,
# so the WLTP figures come from the EU type approval as published in the Dutch type-approval
# register (RDW TGK, CC0): the homologation values themselves.
schema: manual-facts/v1
entered_by: ws3-builder (agent, T-110)
facts:
  # --- Tesla Model Y gen1 Long Range AWD (2021-2024) -------------------------------------
  # RDW TGK Y5LD versions with top speed 217 km/h are the Long Range AWD (the Performance
  # versions of the same variant code are 250 km/h). 2021 approvals (ext 19-21): 542 km;
  # from ext 22 (Feb 2022) to ext 44 (Jan 2025): 533 km. Combined 169 Wh/km throughout.
  - variant_id: tesla-model-y-gen1-long-range
    field: wltp_range_km
    value: 533
    unit: km
    source_url: https://opendata.rdw.nl/resource/gr7t-qfnb.json?typegoedkeuringsnummer=e4*2007/46*1293*30&codevarianttgk=Y5LD&codeuitvoeringtgk=BZB3S5T3
    source_name: "RDW TGK Energiebron Uitvoering (gr7t-qfnb), EU type approval e4*2007/46*1293*30, variant Y5LD, version BZB3S5T3 (Tesla Model Y, CC0)"
    retrieved: 2026-11-17
    quote: '"maximumconstructiesnelheidbgr": "217.00", "verbruikvolledigelekwltpbgr": "169.00", "actieradiusvolledigelekwltpbgr": "533"'
    locator: "Both drivetrain rows of that version; the same 533 km on every 217 km/h Y5LD version from extension 22 to 44"
    confidence: medium
    claim: true
    notes: "2021 approvals (extensions 19-21, e.g. e4*2007/46*1293*20 Y5LD BZB3S5T3) give 542 km at the same 169 Wh/km; the row spans 2021-2024, so the later and most common figure is used. Open EV Data's 719 km is the CLTC figure (see file header)."
  - variant_id: tesla-model-y-gen1-long-range
    field: consumption_kwh_100km
    value: 16.9
    unit: kWh/100km
    source_url: https://opendata.rdw.nl/resource/gr7t-qfnb.json?typegoedkeuringsnummer=e4*2007/46*1293*30&codevarianttgk=Y5LD&codeuitvoeringtgk=BZB3S5T3
    source_name: "RDW TGK Energiebron Uitvoering (gr7t-qfnb), EU type approval e4*2007/46*1293*30, variant Y5LD, version BZB3S5T3 (Tesla Model Y, CC0)"
    retrieved: 2026-11-17
    quote: '"verbruikvolledigelekwltpbgr": "169.00"'
    locator: "WLTP combined electric energy consumption, Wh/km (169 Wh/km = 16.9 kWh/100 km); same on every 217 km/h Y5LD version, extensions 19-44"
    confidence: medium
    claim: true
    notes: "Replaces the derived 11.0 kWh/100 km (79 kWh / 719 km)."

  # --- Tesla Model Y Juniper Long Range AWD (2025-) --------------------------------------
  # RDW TGK YS5LD (dual motor, 201 km/h): 586 km best / 568 km worst, 148-153 Wh/km, from
  # 2025-01-28 (extensions 44-50). InsideEVs (2025-02-21) reports Tesla's European figures as
  # 586 km on 19-inch wheels and 568 km on 20-inch wheels: the same pair.
  - variant_id: tesla-model-y-juniper-long-range-awd
    field: wltp_range_km
    value: 586
    unit: km
    source_url: https://opendata.rdw.nl/resource/gr7t-qfnb.json?typegoedkeuringsnummer=e4*2007/46*1293*46&codevarianttgk=YS5LD&codeuitvoeringtgk=BHB3S5T3X
    source_name: "RDW TGK Energiebron Uitvoering (gr7t-qfnb), EU type approval e4*2007/46*1293*46, variant YS5LD, version BHB3S5T3X (Tesla Model Y, CC0)"
    retrieved: 2026-11-17
    quote: '"volgnummeraandrijving": "1", "maximumconstructiesnelheidbgr": "201.00", "verbruikvolledigelekwltpogr": "148.00", "verbruikvolledigelekwltpbgr": "153.00", "actieradiusvolledigelekwltpogr": "586", "actieradiusvolledigelekwltpbgr": "568"'
    locator: "Drivetrain row 1 of that version; same 586/568 km on YS5LD extensions 44-50"
    confidence: medium
    claim: true
    notes: "Drivetrain row 2 of the same version repeats the gen1 figures (533 km, 169 Wh/km): a stale second-motor row, not this car. Later approvals (YS5MD, from 2025-06) give 600 km, and 600-629 km from 2025-12 (e4*2007/46*1293*51-53); the row spans 2025 onward, so the launch figure is used. Corroborated by InsideEVs 2025-02-21 (https://insideevs.com/news/751466/tesla-model-y-details-europe/): 'a rating of 364 miles (586 km) ... 353 miles (568 km) if you get the 20-inch wheels'."
