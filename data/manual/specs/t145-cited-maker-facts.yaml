# ("uitvoering") with its WLTP figures. Dual-motor variant E3D (2019-2020 builds, the most
# registered gen1 Long Range / Performance in NL: RDW m9d7-ebf2, 2026-11-18):
#   uitvoering BB*  max speed 233 km/h  -> Long Range AWD (560 km / 160 Wh/km)
#   uitvoering PP*  max speed 261 km/h  -> Performance (530 km / 166 Wh/km)
#   (PB* = Performance hardware without the 261 km/h top speed; also 530 km)
# Later extensions carry higher figures for the refreshed cars (variants E3LD / E5LD from
# extension 14, Dec 2020: Long Range 580 / 614 / 602 km, Performance 567 / 547 km). The seed
# variants span 2019-2023 in one row, so the cited figure is the first-type-approval one; the
# later figures are in each fact's notes. Splitting the rows by year is a separate change.
