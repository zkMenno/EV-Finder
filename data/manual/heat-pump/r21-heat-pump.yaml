# (§2 evidence table, §4 import table). One cited fact per generation; the locator is our own
# paraphrase of what the page says (R-21 §2), never a copied table.
#
# Import rules (WS3):
# - Only rows whose model years cover the whole seed generation become a fact here: manual
#   facts carry no year span, so a generation fact applies to every year of it.
# - not_disclosed rows are not entered: no fact = not disclosed (the pipeline default).
# - Where markets differ, the row for a launch country (DE first) is used and the market is
#   named in `notes`; the merge does not split heat_pump by country.
# - Never inferred from trim or order spec (VW ID cars 2022-23 were often delivered without
#   the ordered heat pump: that is why ID rows say `option`, not `standard`).
#
# Not entered yet, because the value changes inside one generation (needs a year span on
# manual facts; asked WS1 2026-11-15, or a seed variant split):
#   tesla-model-3-gen1   2019-2020 none / 2021-2023 standard (insideevs Nyland test; Electrek)
