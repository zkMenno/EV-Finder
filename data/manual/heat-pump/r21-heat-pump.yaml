#   nissan-leaf-ze0      2011-2012 none (GB); 2013-2017 not disclosed
#   cupra-born-gen1      2026 option (DE, ev-supply.de); 2021-2025 not disclosed
#   peugeot-e-208-p21    2022- standard (DE, 🔴 inferred year range); 2019-2021 not disclosed
#   dacia-spring-gen1    2025- none (DE, ev-supply.de); 2021-2024 not disclosed
#   polestar-2-gen1      2025 option (DE, ev-supply.de); 2020-2024 not disclosed
#   volkswagen-id5-gen1  2022- option (VW IE): generation arrives with T-068 (PR #31); add then.
#   renault-megane-e-tech-gen1  also: UK made it standard on all versions from May 2024
#                        (https://www.motor1.com/news/718065/renault-megane-e-tech-updated-pricing/)
