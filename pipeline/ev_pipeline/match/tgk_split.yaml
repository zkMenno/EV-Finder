# T-153: split evidence for TGK versions of variants that share a battery pack.
#
# Read by match/matcher.py (`tgk_split_pool`). Per seed variant id (the candidate root; its
# year bands share the entry), the values that variant's RDW TGK versions carry:
#   type_codes      the TGK variant code, or the uitvoering prefix before "-" (e.g. ZKXZ);
#                   "A+B" = both the variant code A and the uitvoering code B (T-159)
#   power_30min_kw  TGK 30-minute power (one motor; never peak power, Decision 023)
#   top_speed_kmh   TGK top speed
#   motors          2 = dual motor: its TGK versions never state a 30-minute power (one
#                   drivetrain row per motor), so a version stating one is not this variant.
#                   Only listed variants: some dual-motor versions carry one row (I-Pace).
# A candidate whose entry lists a field and lacks the version's value is ruled out; a
# candidate without that field stays. Every candidate ruled out -> review ("tgk: no variant
# fits"). Matching evidence only: nothing here becomes a Fact or reaches a release.
# `basis` names where the values were read. A new car = a new row, no code change.
schema: tgk-split/v1
variants:
  # Stellantis e-CMP 50 kWh (100 kW) vs 51 / 54 kWh (115 kW): the drawn energy overlaps, so
  # the battery check ties them. RDW TGK (CC0), staging 2026-11-19: every ZKXZ version
  # states 57 kW 30-min (WLTP 332-374 km), every ZKWZ version 62 kW (WLTP 413-439 km),
  # across e-208, Corsa, e-2008 and Mokka (244 versions); T-148 Handoff notes.
  peugeot-e-208-p21-50kwh:
    type_codes: [ZKXZ]
    power_30min_kw: [57]
    basis: "rdw-tgk 2026-11-19: ZKXZ versions, 30-min 57 kW, WLTP 349-373 km"
  peugeot-e-208-p21-51kwh:
    type_codes: [ZKWZ]
    power_30min_kw: [62]
    basis: "rdw-tgk 2026-11-19: ZKWZ versions, 30-min 62 kW, WLTP 416-439 km"
  opel-corsa-e-f-50kwh:
    type_codes: [ZKXZ]
    power_30min_kw: [57]
    basis: "rdw-tgk 2026-11-19: ZKXZ versions, 30-min 57 kW, WLTP 349-373 km"
  opel-corsa-e-f-51kwh:
    type_codes: [ZKWZ]
    power_30min_kw: [62]
    basis: "rdw-tgk 2026-11-19: ZKWZ versions, 30-min 62 kW, WLTP 413-439 km"
  peugeot-e-2008-p24-50kwh:
    type_codes: [ZKXZ]
    power_30min_kw: [57]
    basis: "rdw-tgk 2026-11-19: ZKXZ versions, 30-min 57 kW, WLTP 332-374 km"
  peugeot-e-2008-p24-54kwh:
    type_codes: [ZKWZ]
    power_30min_kw: [62]
    basis: "rdw-tgk 2026-11-19: ZKWZ versions, 30-min 62 kW, WLTP 434-436 km"
  opel-mokka-gen1-50kwh:
    type_codes: [ZKXZ]
    power_30min_kw: [57]
    basis: "rdw-tgk 2026-11-19: ZKXZ versions, 30-min 57 kW, WLTP 332-374 km"
  opel-mokka-gen1-54kwh:
    type_codes: [ZKWZ]
    power_30min_kw: [62]
    basis: "rdw-tgk 2026-11-19: ZKWZ versions, 30-min 62 kW, WLTP 434-436 km"
  # Tesla Model Y gen1 Long Range AWD vs Performance share type code Y5LD and the 75-79 kWh
  # pack; TGK top speed tells them apart: 217 km/h (incl. the 2021 Y5CD 507 km LR versions)
  # vs 250 km/h. The RWD (LFP) versions carry their own codes Y6LR / Y7CR: without them the
  # wide battery band let the 57.5 kWh RWD fit the Y5CD energy too (83 kWh drawn).
  # RDW TGK staging 2026-11-19, 96 versions.
  tesla-model-y-gen1-long-range:
    type_codes: [Y5LD, Y5CD]
    top_speed_kmh: [217]
    basis: "rdw-tgk 2026-11-19: Y5LD / Y5CD versions at 217 km/h, WLTP 507-542 km"
  tesla-model-y-gen1-performance:
    type_codes: [Y5LD]
    top_speed_kmh: [250]
    basis: "rdw-tgk 2026-11-19: Y5LD versions at 250 km/h, WLTP 514-528 km"
  # OpenEV's Long Range RWD row (2024, no seed row): its versions are the Y5LR code.
  tesla-model-y-gen1-long-range-rwd:
    type_codes: [Y5LR]
    basis: "rdw-tgk 2026-11-19: Y5LR versions, 30-min 120-127 kW, WLTP 600 km"
  tesla-model-y-gen1-rwd:
    type_codes: [Y6LR, Y7CR]
    basis: "rdw-tgk 2026-11-19: Y6LR / Y7CR versions, 30-min 88-127 kW, WLTP 430-455 km"
  # VW ID.4 gen1 Pro (one motor) vs GTX (two) share the 77 kWh pack. RDW TGK staging
  # 2026-11-19: all GTX versions (4ACX1..., 4ACEFRAE...) state no 30-minute power; the Pro
  # versions state 70 or 89 kW (WLTP 561-650 km), 53 of them tied between Pro and GTX.
  volkswagen-id4-gen1-gtx:
    motors: 2
    basis: "rdw-tgk 2026-11-19: GTX versions, no 30-min power (two drivetrain rows), 180 km/h"
  # --- T-159 (batch: data T-159, 2026-11-19): ties by motor count, other trims' versions ---
  # RDW TGK (CC0), staging recorded 2026-11-19 12:53 UTC. Type code = the TGK variant code.
  # Kia EV3: F5E12 = 58.3 kWh, F5E22 = 81.4 kWh one motor (30-min 50 kW, WLTP 605 km), F5E34 /
  # F5E44 = two motors (no 30-min power, WLTP 572 km). Before: every F5E22 / F5E34 / F5E44
  # version tied Long Range vs Long Range AWD.
  kia-ev3-gen1-standard-range:
    type_codes: [F5E12]
    basis: "rdw-tgk 2026-11-19: F5E12 versions, 30-min 50 kW, WLTP 436 km (65 kWh drawn)"
  kia-ev3-gen1-long-range:
    type_codes: [F5E22]
    basis: "rdw-tgk 2026-11-19: F5E22 versions, 30-min 50 kW, WLTP 605 km (90 kWh drawn)"
  kia-ev3-gen1-awd:
    type_codes: [F5E34, F5E44]
    motors: 2
    basis: "rdw-tgk 2026-11-19: F5E34 / F5E44 versions, no 30-min power (two motors), WLTP 572 km"
  # Kia EV6 facelift (2024-): F5E12 = 63 kWh (not seeded, stays unplaced), F5E22 = 84 kWh one
  # motor (30-min 56 kW, WLTP 560-582 km), F5E44 = two motors (no 30-min power, 188 km/h,
  # WLTP 522 km), F5E64 = GT (260 km/h, not seeded: ruled out of both, review).
  # T-160: the 63 kWh RWD row (Kia DE press kit / price list): F5E12 = 63 kWh, one motor.
  kia-ev6-facelift-63kwh-rwd:
    type_codes: [F5E12]
    basis: "rdw-tgk 2026-11-19: F5E12 versions, 30-min 42 kW, 185 km/h, WLTP 428 km"
  kia-ev6-facelift-84kwh-rwd:
    type_codes: [F5E22]
    basis: "rdw-tgk 2026-11-19: F5E22 versions, 30-min 56 kW, 185 km/h, WLTP 560-582 km"
  kia-ev6-facelift-84kwh-awd:
    type_codes: [F5E44]
    motors: 2
    basis: "rdw-tgk 2026-11-19: F5E44 versions, no 30-min power (two motors), 188 km/h, WLTP 522 km"
  # MINI Countryman (U25): E = one motor, 30-min 68 kW, 170 km/h (uitvoering 41GA / 81GA, WLTP
  # 462-501 km); SE ALL4 = two motors, no 30-min power, 180 km/h (51GA / 11HP, WLTP 432-467 km).
  # Split on top speed (holds across both type codes), not on the uitvoering codes.
  mini-countryman-e-gen1-e:
    top_speed_kmh: [170]
    basis: "rdw-tgk 2026-11-19: COUNTRYMAN E versions, 30-min 68 kW, 170 km/h, WLTP 462-501 km"
  mini-countryman-e-gen1-se-all4:
    top_speed_kmh: [180]
    motors: 2
    basis: "rdw-tgk 2026-11-19: COUNTRYMAN SE ALL4 versions, no 30-min power, 180 km/h, WLTP 432-467 km"
  # Hyundai Inster: the 42 kWh (71 kW) versions state 30-min 23.7 kW and 140 km/h (F4E12 /
  # F5E12, WLTP 303-327 km); the 49 kWh (84 kW) versions 30-min 28.2 kW and 150 km/h (F4E22,
  # WLTP 293-370 km). Energy drawn (47 vs 55 kWh) fits both packs' wide bands, so it tied.
  hyundai-inster-gen1-42kwh:
    power_30min_kw: [23.7]
    top_speed_kmh: [140]
    basis: "rdw-tgk 2026-11-19: F4E12 / F5E12 versions, 30-min 23.7 kW, 140 km/h, WLTP 303-327 km"
  hyundai-inster-gen1-49kwh:
    power_30min_kw: [28.2]
    top_speed_kmh: [150]
    basis: "rdw-tgk 2026-11-19: F4E22 versions, 30-min 28.2 kW, 150 km/h, WLTP 293-370 km"
  # Hyundai Ioniq 5 facelift (2024-): every version's TGK trade-name list reads "IONIQ5 / IONIQ5 N",
  # so the name word "N" put the 84 kWh versions on the N row (T-155 guard: 530-570 km held there).
  # The N is F5E74 (260 km/h, WLTP 448 km); F5E22 / A5E22 = 84 kWh one motor (30-min 56 kW, WLTP
  # 515-570 km); F5E34 / A5E34 = 84 kWh two motors (WLTP 495-546 km); F5E12 = 63 kWh (440 km).
  hyundai-ioniq-5-facelift-n:
    type_codes: [F5E74]
    top_speed_kmh: [260]
    basis: "rdw-tgk 2026-11-19: F5E74 versions (trade name IONIQ5 N), 260 km/h, WLTP 448 km"
  hyundai-ioniq-5-facelift-base:
    type_codes: [F5E22, A5E22]
    basis: "rdw-tgk 2026-11-19: F5E22 / A5E22 versions, 30-min 56 kW, 185 km/h, WLTP 515-570 km"
  hyundai-ioniq-5-facelift-awd:
    type_codes: [F5E34, A5E34]
    basis: "rdw-tgk 2026-11-19: F5E34 / A5E34 versions, 185 km/h, WLTP 495-546 km (one A5E34 states a 30-min power, so no motors: 2)"
  hyundai-ioniq-5-facelift-63kwh-rwd:
    type_codes: [F5E12]
    basis: "rdw-tgk 2026-11-19: F5E12 versions, 30-min 42 kW, WLTP 440 km (68.6 kWh drawn)"
  # Audi e-tron 55 (GE, 2019-): variant codes XBM1JQ1 / SBM1JQ1 (Sportback). The 2022 "Q8 55
  # E-TRON" versions (XBM1JAQ1 / SBM1JAQ1, WLTP 629 km, first admitted 2022) fall in this
  # generation's years and landed here (T-155 guard: held); they are not the e-tron 55: review.
  # The other GE rows get their own codes too, or the Q8 versions move to whichever row has none.
  audi-e-tron-ge-55:
    type_codes: [XBM1JQ1, SBM1JQ1]
    basis: "rdw-tgk 2026-11-19: E-TRON 55 / E-TRON SPORTBACK 55 versions, 200 km/h, WLTP 374-484 km"
  audi-e-tron-ge-50:
    type_codes: [XBM2RQ1, SBM2RQ1]
    basis: "rdw-tgk 2026-11-19: E-TRON 50 / E-TRON SPORTBACK 50 versions, 190 km/h, WLTP 283-379 km"
  audi-e-tron-ge-s:
    type_codes: [XBMQ3Q1, SBMQ3Q1]
    basis: "rdw-tgk 2026-11-19: E-TRON S / E-TRON S SPORTBACK versions, 210 km/h, WLTP 393 km"
  # Porsche Taycan: the seed has one generation; its rows (OpenEV MY2023-25: base 71 kWh net,
  # 4S 83.7 kWh net, 4S 463 km) are the pre-2024 car. TGK variant codes with second letter A-E
  # are the 2020-23 versions, M-S the 2024 update (e.g. 4S JN22 / CN22 / SN22 676 km, Turbo S
  # JP22 / CP22 / SP22 665 km, Turbo JO22 / SO22; T-155 guard held them on the 4S / Turbo S
  # rows): they now fit no row (review). Turbo GT is 2024-only (JR22 / JS22). Taycan 4 (CA22 /
  # CM22 / JM22) and GTS (JE22 / SE22 / JQ22) have no row.
  # The 4th digit of the 2020-23 uitvoering code is the pack: x0x0000 = Performance Battery
  # (85-89 kWh drawn: base 451 / 464 km, 4S 429 / 472 km), x1x1000 = Performance Battery Plus
  # (99-103 kWh drawn). Base and 4S rows are listed as variant + uitvoering pairs (fresh review
  # #199: JA12 alone put the base's PB+ 520 / 541 km versions on the 71 kWh row).
  porsche-taycan-gen1-base:
    type_codes: [JA12+1040000, JA12+1050000, JA12+1140000, JA12+1150000, SA12+1140000, SA12+1150000]
    basis: "rdw-tgk 2026-11-19: TAYCAN (RWD) JA12 / SA12 versions with the Performance Battery (uitvoering x0x0000), WLTP 451-464 km, 85.8-87 kWh drawn, 2021-22"
  porsche-taycan-gen1-4s:
    type_codes: [JB22+1041000, JB22+1051000, JB22+1141000, JB22+1151000, CB22+1041000, CB22+1051000, CB22+1141000, CB22+1151000, SB22+1141000, SB22+1151000]
    basis: "rdw-tgk 2026-11-19: TAYCAN 4S JB22 / CB22 (Cross Turismo) / SB22 (Sport Turismo) versions with the Performance Battery Plus (uitvoering x1x1000), WLTP 465-545 km, 99.8-103 kWh drawn, 2020-23"
  porsche-taycan-gen1-turbo:
    type_codes: [JC22, CC22, SC22]
    basis: "rdw-tgk 2026-11-19: TAYCAN TURBO JC22 / CC22 / SC22 versions (all Performance Battery Plus), 2020-23"
  porsche-taycan-gen1-turbo-s:
    type_codes: [JD22, CD22, SD22]
    basis: "rdw-tgk 2026-11-19: TAYCAN TURBO S JD22 / CD22 / SD22 versions (all Performance Battery Plus), 2020-24"
  porsche-taycan-gen1-turbo-gt:
    type_codes: [JR22, JS22]
    basis: "rdw-tgk 2026-11-19: TAYCAN TURBO GT JR22 / JS22 versions (290 / 305 km/h), 2024-"
