# T-081: used price band per variant, build year and country. Model parameters (WS1).
# Evidence: research/R-40-used-ev-price-anchors.md. Every band from this model is an estimate.
schema: used-price-params/v1
model_version: "0.1"
anchors_as_of: "2026-09-28"   # DAT 3-year BEV figure; refit when it moves by more than 3 points

countries: [NL, DE, FR, BE, UK, ES, IT]   # ES, IT: Decision 066 (launch countries)
currency: {NL: EUR, DE: EUR, FR: EUR, BE: EUR, UK: GBP, ES: EUR, IT: EUR}

# Share of the list price kept, by age in whole years since first registration (linear between).
# 1, 3, 5 = anchors (R-40 §2); 2 and 4 = geometric mean of their neighbours; 6-10 = -8 % a year.
# `default` applies to every country without its own row (no country-specific EV curves yet).
curves:
  default:
    points: {0: 1.0, 1: 0.75, 2: 0.62, 3: 0.515, 4: 0.465, 5: 0.42, 6: 0.386, 7: 0.355, 8: 0.327, 9: 0.301, 10: 0.277}
    extrapolated_from_age: 6     # ages >= 6 are extrapolated: confidence low
    max_age: 12                  # older cars: no band (curve too uncertain)
    # T-113: citation of this published curve (the fallback when no `fitted` block exists).
    source:
      name: "DAT residual values, 3-year-old BEVs 51.5 % of list price (via autohaus.de); other ages per research/R-40"
      url: https://www.autohaus.de/nachrichten/gw-trends/dat-spritpreise-machen-gebrauchte-e-autos-teurer-3909599
      ref: research/R-40-used-ev-price-anchors.md
      date: "2026-09-28"

spread: 0.12                     # P25 / P75 = median x (1 -/+ spread); R-40 §2
rounding: 100                    # round amounts to this many currency units

# List price at registration. Order of preference per country and build year:
#   1. a price_new fact for that country and that record year (median if several)
#   2. the nearest record year in that country, at most `max_year_gap` away
#   3. EU countries only: the NL price for that year, ex Dutch VAT, plus local VAT (low confidence)
max_year_gap: 2
vat: {NL: 0.21, DE: 0.19, FR: 0.20, BE: 0.21, UK: 0.20, ES: 0.21, IT: 0.22}   # standard rates, 2026
cross_country_from: NL
cross_country_to: [DE, FR, BE, ES, IT]   # not UK: other currency and right-hand-drive market

# Age is measured at the release date from the middle of the build year (1 July).
mid_year_month: 7

# Manual samples (layer 2, aggregates only): data/manual/prices/*.yaml (WS3 writes them).
samples_dir: manual/prices
min_samples: 5                   # a sampled band needs at least this many cars (T-056)
max_sample_age_days: 120         # older aggregates are ignored for bands (still back-tested)

# T-113 (Decision 064): depreciation fit on our own samples (derive/depreciation.py).
# A fitted curve replaces the published one only with enough points and generations;
# a segment gets its own curve only with enough of its own. Ages in years, shares of list price.
fit:
  min_points: 20
  min_generations: 8
  segment_min_points: 15
  segment_min_generations: 5
  max_age: 12
  worst_listed: 5

# Output of `ev used-price fit --release 1 --as-of 2026-11-17` (106 gated sample rows from
# Marktplaats NL + 2dehands BE, Decision 060; RDW list prices). Refit with the same command
# when samples or list prices (T-112) change; paste the new block in its own PR (G-06).
# This block: refit with PR #78 (only variants built in the sample year), 2026-11-17.
fitted:
  method: least squares on ln(share of list price kept) vs age; one point per sample
    row
  fitted_at: '2026-11-17'
  on_release: 1
  samples_observed:
  - BE
  - NL
  default:
    points:
      0: 0.886
      1: 0.79
      2: 0.705
      3: 0.629
      4: 0.561
      5: 0.501
      6: 0.447
      7: 0.399
      8: 0.356
      9: 0.318
      10: 0.283
      11: 0.253
      12: 0.226
    extrapolated_from_age: 9
    max_age: 12
    a: 0.8858
    k: 0.114
    quality:
      points: 76
      generations: 19
      countries:
      - BE
      - NL
      age_range:
      - 1.4
      - 8.4
      r2_log: 0.675
      in_sample_median_abs_error: 0.1
  by_segment:
    J-medium:
      points:
        0: 0.9
        1: 0.8
        2: 0.71
        3: 0.631
        4: 0.56
        5: 0.497
        6: 0.442
        7: 0.392
        8: 0.348
        9: 0.309
        10: 0.275
        11: 0.244
        12: 0.217
      extrapolated_from_age: 6
      max_age: 12
      a: 0.9004
      k: 0.1187
      quality:
        points: 33
        generations: 6
        countries:
        - BE
        - NL
        age_range:
        - 1.4
        - 5.4
        r2_log: 0.593
        in_sample_median_abs_error: 0.081
  holdout:
    method: 'leave one generation out: fit on the other generations, then the visitor''s
      path (choose_curve, kept_share on the yearly table, rounded band per variant)'
    fitted:
      rows_compared: 76
      median_abs_error: 0.108
      median_error: 0.013
      within_15pct: 0.645
      in_band: 0.526
      curves_used:
        fitted: 43
        fitted:J-medium: 33
    published:
      rows_compared: 76
      median_abs_error: 0.148
      median_error: -0.148
      within_15pct: 0.5
      in_band: 0.355
